name: "🔧 Audit codebase with fallow"
run-name: "🔧 Fallow · audit · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit complete checkout with Fallow
        uses: fallow-rs/fallow@v3
        with:
          command: audit
