name: "🔧 Fallow · full repository"
run-name: "🔧 Fallow · full repository · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Analyze entire repository (not PR diff)
        id: fallow
        shell: bash
        run: |
          mkdir -p fallow-reports
          set +e
          npx --yes fallow --format json --no-cache > fallow-reports/full-repository.json
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ] || [ "$status" -gt 2 ]; then
            echo "::error::Fallow failed to execute (exit code $status)"
            exit "$status"
          fi
          echo "Fallow finished full-repository scan (exit code $status)"
      - name: Upload complete Fallow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallow-full-repository-${{ github.run_id }}
          path: fallow-reports/full-repository.json
          if-no-files-found: error
