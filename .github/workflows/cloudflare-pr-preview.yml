name: "▲ Publish userscript previews to Cloudflare"
on:
  workflow_run:
    workflows: ["▲ PR userscript preview artifacts"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: cf-pr-preview-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download & validate untrusted build artifact via GitHub API
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node scripts/cloudflare-pr-preview.mjs --mode=validate

      - name: Publish validated files to Cloudflare R2
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          PREVIEW_UPLOAD_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: node build/publish-pr-preview.mjs "${{ steps.validate.outputs.artifact_dir }}"

      - name: Publish preview summary
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
        run: node scripts/cloudflare-pr-preview.mjs --mode=summary

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Remove closed PR preview from Cloudflare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_UPLOAD_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: node scripts/cloudflare-pr-preview.mjs --mode=cleanup
