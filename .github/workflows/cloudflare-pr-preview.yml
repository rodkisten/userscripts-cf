name: "▲ Publish userscript previews to Cloudflare"
on:
  workflow_run:
    workflows: ["▲ PR userscript preview artifacts"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: cf-pr-preview-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download untrusted build artifact without executing its code
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: gh run download "$RUN_ID" --name "userscripts-pr-$PR_NUMBER" --dir dist/pr-preview
      - name: Publish validated files to Cloudflare R2
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREVIEW_UPLOAD_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: node build/publish-pr-preview.mjs "dist/pr-preview/$PR_NUMBER"
      - name: Published preview
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: echo "https://userscripts.preview.migos.club/$PR_NUMBER/" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Remove closed PR preview from Cloudflare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_UPLOAD_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://userscripts.preview.migos.club/_publish/" + process.env.PR_NUMBER, {
            method: "DELETE",
            headers: { authorization: "Bearer " + process.env.PREVIEW_UPLOAD_TOKEN },
          });
          if (!response.ok) throw Error("Cleanup failed: " + response.status);
          console.log("Removed preview #" + process.env.PR_NUMBER);
          NODE
