name: 🧩 US · Dependency Graph

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source:
        description: Source directory
        default: src
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: ${{ inputs.source || 'src' }}
  MADGE_VERSION: '8.0.0'
  ROD_COMMENT_KIT: ${{ github.workspace }}/.rod-shared/packages/comment-kit/index.mjs

jobs:
  graph:
    name: 🕸️ Architecture Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🗂️ Initialize graph directory
        shell: bash
        run: echo "GRAPH_DIR=$RUNNER_TEMP/dependency-graph" >> "$GITHUB_ENV"

      - name: 📥 Checkout HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🎨 Checkout shared Comment Kit
        uses: actions/checkout@v4
        with:
          repository: rodkisten/github
          ref: a2c930218dd1ad68720326c0557e7da55b6f55e8
          path: .rod-shared
          sparse-checkout: packages/comment-kit
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: rodkisten/github/setup-node@main
        with:
          node-version: '24'
          install: 'false'
          cache: 'false'

      - name: 🌈 Setup rodlog
        uses: rodkisten/github/setup-rodlog@main

      - name: 📦 Prepare graph tools
        uses: rodkisten/github/console-run@main
        with:
          title: Prepare graph tools
          command: |
            set -euo pipefail

            mkdir -p "$GRAPH_DIR"

            sudo apt-get update -qq
            sudo apt-get install -y graphviz

            npm install \
              --prefix "$GRAPH_DIR/tools" \
              --no-audit \
              --no-fund \
              --ignore-scripts \
              "madge@$MADGE_VERSION"

      - name: 🧬 Prepare base revision
        uses: rodkisten/github/console-run@main
        env:
          BASE_SHA: refs/remotes/origin/main
        with:
          title: Prepare base revision
          command: |
            set -euo pipefail

            git rev-parse "$BASE_SHA"
            git worktree add \
              --detach \
              "$GRAPH_DIR/base" \
              "$BASE_SHA"

      - name: 🕸️ Generate dependency graphs
        uses: rodkisten/github/console-run@main
        with:
          title: Generate dependency graphs
          command: |
            set -euo pipefail

            node scripts/dependency-graph.mjs generate

      - name: 🔬 Analyze architectural changes
        id: analyze
        uses: rodkisten/github/console-run@main
        with:
          title: Analyze architectural changes
          command: |
            set -euo pipefail

            node scripts/dependency-graph.mjs analyze

      - name: 📦 Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: |
            ${{ env.GRAPH_DIR }}/*.txt
            ${{ env.GRAPH_DIR }}/*.dot
            ${{ env.GRAPH_DIR }}/*.svg
            ${{ env.GRAPH_DIR }}/*.json
            ${{ env.GRAPH_DIR }}/*.mmd
            ${{ env.GRAPH_DIR }}/*.md
          retention-days: 14
          if-no-files-found: error

      - name: 🤖 Authenticate Rod App
        id: app
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: rodkisten/github/app-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: 📝 Publish architecture in PR description
        if: steps.app.outputs.token != ''
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/dependency-graph.mjs publish

      - name: 📋 Final summary
        if: always()
        uses: rodkisten/github/ci-summary@main
        with:
          title: '🕸️ Dependency Graph'
          status: ${{ job.status }}
          details: |
            | Property | Value |
            | --- | --- |
            | Repository | `${{ github.repository }}` |
            | Source | `${{ env.SOURCE_DIR }}` |
            | Madge | `${{ env.MADGE_VERSION }}` |
            | Revision | `${{ github.event.pull_request.head.sha || github.sha }}` |
            | PR | `${{ github.event.pull_request.number || 'Manual execution' }}` |

            🦾 Powered by Rod Actions
