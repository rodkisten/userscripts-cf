name: 🧩 US · Dependency Graph

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source:
        description: Source directory
        default: src
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: ${{ inputs.source || 'src' }}
  MADGE_VERSION: '8.0.0'

jobs:
  graph:
    name: 🕸️ Architecture Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🗂️ Initialize graph directory
        shell: bash
        run: echo "GRAPH_DIR=$RUNNER_TEMP/dependency-graph" >> "$GITHUB_ENV"

      - name: 📥 Checkout HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: rodkisten/github/setup-node@main
        with:
          node-version: '24'
          install: 'false'
          cache: 'false'

      - name: 🌈 Setup rodlog
        uses: rodkisten/github/setup-rodlog@main

      - name: 📦 Prepare graph tools
        uses: rodkisten/github/console-run@main
        with:
          title: Prepare graph tools
          command: |
            set -euo pipefail

            mkdir -p "$GRAPH_DIR"

            sudo apt-get update -qq
            sudo apt-get install -y graphviz

            npm install \
              --prefix "$GRAPH_DIR/tools" \
              --no-audit \
              --no-fund \
              --ignore-scripts \
              "madge@$MADGE_VERSION"

      - name: 🧬 Prepare base revision
        uses: rodkisten/github/console-run@main
        env:
          BASE_SHA: refs/remotes/origin/main
        with:
          title: Prepare base revision
          command: |
            set -euo pipefail

            git rev-parse "$BASE_SHA"
            git worktree add \
              --detach \
              "$GRAPH_DIR/base" \
              "$BASE_SHA"

      - name: 🕸️ Generate dependency graphs
        uses: rodkisten/github/console-run@main
        with:
          title: Generate dependency graphs
          command: |
            set -euo pipefail

            node --input-type=commonjs <<'JS'
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = process.env.GRAPH_DIR;
            const madge = require(path.join(dir, 'tools/node_modules/madge'));
            async function generate(root, label) {
              const source = path.resolve(root, process.env.SOURCE_DIR);
              const write = (suffix, value) => fs.writeFileSync(
                path.join(dir, label + suffix), JSON.stringify(value, null, 2)
              );
              if (!fs.existsSync(source)) {
                write('.json', {});
                for (const suffix of ['.orphans.json', '.leaves.json', '.circular.json']) write(suffix, []);
                return;
              }
              const config = {
                baseDir: source,
                fileExtensions: ['ts','tsx','js','jsx','mjs','cjs','mts','cts'],
                excludeRegExp: [/node_modules|dist|coverage/]
              };
              const tsconfig = path.join(root, 'tsconfig.json');
              if (fs.existsSync(tsconfig)) config.tsConfig = tsconfig;
              console.log('Analyzing ' + label + ': ' + source);
              const result = await madge(source, config);
              write('.json', result.obj());
              write('.orphans.json', result.orphans());
              write('.leaves.json', result.leaves());
              write('.circular.json', result.circular());
              write('.warnings.json', result.warnings());
              fs.writeFileSync(path.join(dir, label + '.dot'), await result.dot());
              await result.image(path.join(dir, label + '.svg'));
              console.log(label + ': ' + Object.keys(result.obj()).length + ' modules, ' + result.circular().length + ' cycles');
            }
            (async () => {
              await generate(process.env.GITHUB_WORKSPACE, 'head');
              await generate(path.join(dir, 'base'), 'base');
            })().catch(error => { console.error(error); process.exitCode = 1; });
            JS

      - name: 🔬 Analyze architectural changes
        id: analyze
        uses: rodkisten/github/console-run@main
        with:
          title: Analyze architectural changes
          command: |
            set -euo pipefail

            node --input-type=module <<'JS'
            import fs from 'node:fs';
            import path from 'node:path';

            const dir = process.env.GRAPH_DIR;

            const read = name =>
              JSON.parse(
                fs.readFileSync(
                  path.join(dir, `${name}.json`),
                  'utf8'
                )
              );

            const base = read('base');
            const head = read('head');

            const difference = (a, b) =>
              [...a].filter(x => !b.has(x)).sort();

            const modules = graph =>
              new Set([
                ...Object.keys(graph),
                ...Object.values(graph).flat()
              ]);

            const edges = graph =>
              new Set(
                Object.entries(graph).flatMap(
                  ([from, targets]) =>
                    targets.map(to => JSON.stringify([from, to]))
                )
              );

            const baseModules = modules(base);
            const headModules = modules(head);

            const baseEdges = edges(base);
            const headEdges = edges(head);

            const addedModules = difference(
              headModules, baseModules
            );

            const removedModules = difference(
              baseModules, headModules
            );

            const addedEdges = difference(
              headEdges, baseEdges
            );

            const removedEdges = difference(
              baseEdges, headEdges
            );

            // Strongly connected components (Tarjan).
            function cycles(graph) {
              let index = 0;
              const indices = new Map();
              const low = new Map();
              const stack = [];
              const active = new Set();
              const result = [];

              function visit(node) {
                indices.set(node, index);
                low.set(node, index++);
                stack.push(node);
                active.add(node);

                for (const dep of graph[node] || []) {
                  if (!indices.has(dep)) {
                    visit(dep);
                    low.set(node, Math.min(
                      low.get(node), low.get(dep)
                    ));
                  } else if (active.has(dep)) {
                    low.set(node, Math.min(
                      low.get(node), indices.get(dep)
                    ));
                  }
                }

                if (low.get(node) !== indices.get(node)) return;

                const component = [];
                let item;

                do {
                  item = stack.pop();
                  active.delete(item);
                  component.push(item);
                } while (item !== node);

                if (
                  component.length > 1 ||
                  (graph[node] || []).includes(node)
                ) {
                  result.push(JSON.stringify(component.sort()));
                }
              }

              for (const node of modules(graph)) {
                if (!indices.has(node)) visit(node);
              }

              return new Set(result);
            }

            function orphans(graph) {
              const incoming = new Set(
                Object.values(graph).flat()
              );

              return new Set(
                Object.keys(graph).filter(
                  node => !incoming.has(node)
                    && !(graph[node] || []).length
                )
              );
            }

            const baseCycles = cycles(base);
            const headCycles = cycles(head);

            const newCycles = difference(
              headCycles, baseCycles
            );

            const resolvedCycles = difference(
              baseCycles, headCycles
            );

            const baseOrphans = orphans(base);
            const headOrphans = orphans(head);

            const changed = new Map();

            for (const edge of [...addedEdges, ...removedEdges]) {
              const [from] = JSON.parse(edge);
              changed.set(from, (changed.get(from) || 0) + 1);
            }

            const affected = [...changed.entries()]
              .sort((a, b) => b[1] - a[1])
              .slice(0, 15);

            const delta = (a, b) => {
              const value = b - a;
              return value > 0 ? `+${value}` : `${value}`;
            };

            const safe = value =>
              String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\|/g, '&#124;')
                .replace(/`/g, '&#96;')
                .replace(/[\r\n]/g, ' ');

            const lines = [
              '<!-- rod-dependency-graph -->',
              '## 🕸️ Architecture Intelligence',
              '',
              newCycles.length
                ? '⚠️ New circular dependency groups detected.'
                : '🟢 No new circular dependency groups.',
              '',
              '| Metric | Base | HEAD | Δ |',
              '| :--- | ---: | ---: | ---: |',
              `| 📦 Modules | ${baseModules.size} | ${headModules.size} | ${delta(baseModules.size, headModules.size)} |`,
              `| 🔗 Dependencies | ${baseEdges.size} | ${headEdges.size} | ${delta(baseEdges.size, headEdges.size)} |`,
              `| 🔄 Circular groups | ${baseCycles.size} | ${headCycles.size} | ${delta(baseCycles.size, headCycles.size)} |`,
              `| 🏝️ Isolated modules | ${baseOrphans.size} | ${headOrphans.size} | ${delta(baseOrphans.size, headOrphans.size)} |`,
              '',
              '### 🧬 Dependency changes',
              '',
              `- 🟢 **${addedModules.length}** modules added`,
              `- 🔴 **${removedModules.length}** modules removed`,
              `- 🟢 **${addedEdges.length}** dependencies added`,
              `- 🔴 **${removedEdges.length}** dependencies removed`,
              `- 🔄 **${newCycles.length}** new circular groups`,
              `- ✨ **${resolvedCycles.length}** resolved circular groups`,
              ''
            ];

            // Mermaid: render only the changed subgraph.
            const graph = ['flowchart TD'];
            const ids = new Map();

            function node(name) {
              if (ids.has(name)) return ids.get(name);

              const id = `n${ids.size}`;
              ids.set(name, id);

              const label = name
                .replace(/[^a-zA-Z0-9_./@ -]/g, '_')
                .slice(0, 100);

              graph.push(`  ${id}["${label}"]`);
              return id;
            }

            const visualEdges = [
              ...addedEdges.map(edge => [edge, 'added']),
              ...removedEdges.map(edge => [edge, 'removed'])
            ].slice(0, 50);

            for (const [edge, type] of visualEdges) {
              const [from, to] = JSON.parse(edge);
              const a = node(from);
              const b = node(to);

              graph.push(
                type === 'added'
                  ? `  ${a} --> ${b}`
                  : `  ${a} -.-> ${b}`
              );
            }

            for (const name of addedModules.slice(0, 30)) {
              graph.push(`  class ${node(name)} added`);
            }

            for (const name of removedModules.slice(0, 30)) {
              graph.push(`  class ${node(name)} removed`);
            }

            graph.push(
              '  classDef added fill:#14532d,stroke:#22c55e,color:#fff',
              '  classDef removed fill:#7f1d1d,stroke:#ef4444,color:#fff'
            );

            visualEdges.forEach(([, type], i) => {
              graph.push(
                `  linkStyle ${i} stroke:${
                  type === 'added' ? '#22c55e' : '#ef4444'
                },stroke-width:2px`
              );
            });

            fs.writeFileSync(
              path.join(dir, 'changes.mmd'),
              graph.join('\n')
            );

            if (ids.size) {
              lines.push(
                '```mermaid',
                ...graph,
                '```',
                '',
                '🟢 Added · 🔴 Removed',
                '',
                'Showing up to 50 changed edges.',
                ''
              );
            } else {
              lines.push(
                '> No dependency graph changes.',
                ''
              );
            }

            function section(title, items, format = safe) {
              if (!items.length) return;

              lines.push(
                '<details>',
                `<summary>${title} (${items.length})</summary>`,
                ''
              );

              for (const item of items.slice(0, 50)) {
                lines.push(`- ${format(item)}`);
              }

              if (items.length > 50) {
                lines.push(`- … ${items.length - 50} more`);
              }

              lines.push('', '</details>', '');
            }

            section('🟢 Added modules', addedModules);
            section('🔴 Removed modules', removedModules);

            const formatEdge = edge =>
              JSON.parse(edge).map(safe).join(' → ');

            section(
              '🟢 Added dependencies',
              addedEdges,
              formatEdge
            );

            section(
              '🔴 Removed dependencies',
              removedEdges,
              formatEdge
            );

            section(
              '⚠️ New circular dependency groups',
              newCycles,
              cycle => JSON.parse(cycle).map(safe).join(', ')
            );

            section(
              '✨ Resolved circular dependency groups',
              resolvedCycles,
              cycle => JSON.parse(cycle).map(safe).join(', ')
            );

            if (affected.length) {
              lines.push(
                '### 🎯 Most affected modules',
                '',
                '| Module | Changed imports |',
                '| :--- | ---: |'
              );

              for (const [name, count] of affected) {
                lines.push(`| ${safe(name)} | ${count} |`);
              }

              lines.push('');
            }

            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/` +
              `${process.env.GITHUB_REPOSITORY}/actions/runs/` +
              process.env.GITHUB_RUN_ID;

            lines.push(
              '### 📦 Full dependency graphs',
              '',
              `[Download SVG, JSON and Mermaid artifacts](${runUrl}#artifacts)`,
              '',
              `[🔍 View workflow logs](${runUrl})`,
              '',
              '---',
              '<sub>🦾 Rod Actions · Architecture Intelligence</sub>'
            );

            const report = {
              base: {
                modules: baseModules.size,
                dependencies: baseEdges.size,
                circularGroups: baseCycles.size,
                isolatedModules: baseOrphans.size
              },
              head: {
                modules: headModules.size,
                dependencies: headEdges.size,
                circularGroups: headCycles.size,
                isolatedModules: headOrphans.size
              },
              addedModules,
              removedModules,
              addedEdges: addedEdges.map(value => JSON.parse(value)),
              removedEdges: removedEdges.map(value => JSON.parse(value)),
              newCycles: newCycles.map(value => JSON.parse(value)),
              resolvedCycles: resolvedCycles.map(value => JSON.parse(value)),
              affected
            };

            const markdown = lines.join('\n');

            const reports = [{ key: 'summary', body: markdown }];
            function publish(key, title, body) {
              reports.push({ key, body: '## ' + title + '\n\n' + body + '\n\n[Full artifacts](' + runUrl + '#artifacts)' });
            }

            function mermaid(entries) {
              const ids = new Map();
              const out = ['flowchart LR'];
              function id(name) {
                if (!ids.has(name)) {
                  const key = 'n' + ids.size;
                  ids.set(name, key);
                  out.push('  ' + key + '["' + name.replace(/[^a-zA-Z0-9_./@ -]/g, '_').slice(0, 120) + '"]');
                }
                return ids.get(name);
              }
              for (const [from, targets] of entries) {
                const a = id(from);
                for (const to of targets) out.push('  ' + a + ' --> ' + id(to));
              }
              return out.join('\n');
            }

            for (const [label, data] of [['base', base], ['head', head]]) {
              const entries = Object.entries(data).sort(([a], [b]) => a.localeCompare(b));
              fs.writeFileSync(path.join(dir, label + '.mmd'), mermaid(entries));
              const chunks = [];
              let chunk = [], count = 0;
              for (const [from, targets] of entries) {
                const parts = targets.length ? Array.from({length: Math.ceil(targets.length / 40)}, (_, i) => targets.slice(i * 40, i * 40 + 40)) : [[]];
                for (const part of parts) {
                  const cost = Math.max(1, part.length);
                  if (count + cost > 60 && chunk.length) { chunks.push(chunk); chunk = []; count = 0; }
                  chunk.push([from, part]); count += cost;
                }
              }
              if (chunk.length) chunks.push(chunk);
              // Full graphs remain in artifacts; cap inline pages to avoid API spam.
              for (const [i, page] of chunks.slice(0, 8).entries()) {
                publish(label + '-graph-' + i, '🕸️ ' + (label === 'base' ? 'main baseline' : 'PR HEAD') + ' · graph ' + (i + 1) + '/' + chunks.length, '\x60\x60\x60mermaid\n' + mermaid(page) + '\n\x60\x60\x60');
              }
            }
            for (const [key, title, items] of [
              ['added', '🟢 Added imports', addedEdges.map(formatEdge)],
              ['removed', '🔴 Removed imports', removedEdges.map(formatEdge)],
              ['cycles', '🔄 Circular groups', [...headCycles].map(x => JSON.parse(x).map(safe).join(' ↔ '))],
              ['isolated', '🏝️ Isolated modules', [...headOrphans].map(safe)]
            ]) {
              for (let i = 0; i < Math.max(1, Math.ceil(items.length / 100)); i++) {
                if (i >= 8) break;
                publish(key + '-' + i, title + ' · ' + (i + 1), items.slice(i * 100, i * 100 + 100).map(x => '- ' + x.slice(0, 400)).join('\n') || 'None');
              }
            }
            fs.writeFileSync(path.join(dir, 'comments.json'), JSON.stringify(reports));


            fs.writeFileSync(
              path.join(dir, 'report.json'),
              JSON.stringify(report, null, 2)
            );

            fs.writeFileSync(
              path.join(dir, 'report.md'),
              markdown
            );

            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              markdown + '\n'
            );

            console.log('Architecture analysis completed');
            console.log(JSON.stringify({
              modules: headModules.size,
              dependencies: headEdges.size,
              newCycles: newCycles.length
            }, null, 2));
            JS

      - name: 📦 Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: |
            ${{ env.GRAPH_DIR }}/*.txt
            ${{ env.GRAPH_DIR }}/*.dot
            ${{ env.GRAPH_DIR }}/*.svg
            ${{ env.GRAPH_DIR }}/*.json
            ${{ env.GRAPH_DIR }}/*.mmd
            ${{ env.GRAPH_DIR }}/*.md
          retention-days: 14
          if-no-files-found: error

      - name: 🤖 Authenticate Rod App
        id: app
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: rodkisten/github/app-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: 💬 Publish sticky PR comment
        if: steps.app.outputs.token != ''
        uses: actions/github-script@v7
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- rod-dependency-graph -->';

            const body = fs.readFileSync(
              path.join(process.env.GRAPH_DIR, 'report.md'),
              'utf8'
            );

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const bot = `${process.env.APP_SLUG}[bot]`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const reports = JSON.parse(fs.readFileSync(
              path.join(process.env.GRAPH_DIR, 'comments.json'), 'utf8'
            ));
            const keep = new Set();
            for (const report of reports) {
              const tag = report.key === 'summary' ? marker : '<!-- rod-dependency-graph:' + report.key + ' -->';
              const raw = report.body.replace(marker, '').trim();
              const heading = raw.split('\n').find(line => line.startsWith('## '));
              const title = heading ? heading.slice(3) : 'Architecture report';
              const detail = heading ? raw.replace(heading, '').trim() : raw;
              const content = tag + '\n<details>\n<summary>' + title + '</summary>\n\n' + detail + '\n\n</details>';
              const existing = comments.find(c => c.user?.login === bot && c.body?.includes(tag));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: content });
                keep.add(existing.id);
              } else {
                const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body: content });
                keep.add(data.id);
              }
            }
            for (const comment of comments) {
              if (comment.user?.login === bot && /<!-- rod-dependency-graph(?::[^>]+)? -->/.test(comment.body || '') && !keep.has(comment.id)) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }

      - name: 📋 Final summary
        if: always()
        uses: rodkisten/github/ci-summary@main
        with:
          title: '🕸️ Dependency Graph'
          status: ${{ job.status }}
          details: |
            | Property | Value |
            | --- | --- |
            | Repository | `${{ github.repository }}` |
            | Source | `${{ env.SOURCE_DIR }}` |
            | Madge | `${{ env.MADGE_VERSION }}` |
            | Revision | `${{ github.event.pull_request.head.sha || github.sha }}` |
            | PR | `${{ github.event.pull_request.number || 'Manual execution' }}` |

            🦾 Powered by Rod Actions
