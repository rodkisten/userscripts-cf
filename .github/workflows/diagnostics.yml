name: Validate changed userscripts
run-name: "Validate changed · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope"
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: read
  actions: write

concurrency:
  group: userscripts-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate affected files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Detect changes and plan validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || 'changed' }}
        run: bash build/validate-changed.sh plan
      - name: Install dependencies
        id: install
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        run: npm ci --legacy-peer-deps
      - name: Dispatch lockfile repair when installation fails
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run repair-lockfile.yml --ref "$BRANCH"
          echo "Lockfile repair requested for $BRANCH. Its commit will trigger a new validation." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail current validation on installation error
        if: steps.install.outcome == 'failure'
        run: exit 1
      - name: Check formatting
        id: formatting
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run format:check
      - name: Dispatch formatting repair
        if: steps.formatting.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run prettier-full.yml --ref "$BRANCH" -f target_branch="$BRANCH" -f create_pr=false
          echo "Formatting repair requested for $BRANCH; its commit will trigger validation again." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail current validation on formatting error
        if: steps.formatting.outcome == 'failure'
        run: exit 1
      - name: Restore exact-source validation result
        id: validation_cache
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.formatting.outcome == 'success' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .validation-cache/passed
          key: userscripts-validation-v1-${{ runner.os }}-node24-${{ hashFiles('src/**', 'tests/**', 'build/**', 'labs/**', 'playground/**', 'public/**', 'migration/**', 'userscripts.config.js', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.js', '.github/workflows/diagnostics.yml') }}
      - name: Validate affected code
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.formatting.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FULL: ${{ steps.plan.outputs.full }}
        run: bash build/validate-changed.sh run
      - name: Record successful exact-source validation
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.formatting.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true' && success()
        shell: bash
        run: |
          mkdir -p .validation-cache
          printf '%s\n' "Validation passed for exact source fingerprint" > .validation-cache/passed
      - name: Report reused validation
        if: steps.validation_cache.outputs.cache-hit == 'true'
        run: echo "Reused successful validation for identical source, tests and configuration fingerprint." >> "$GITHUB_STEP_SUMMARY"
