name: Validate changed userscripts
run-name: "Validate changed · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope"
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: read

concurrency:
  group: userscripts-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate affected files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Detect changes and plan validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || 'changed' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$SCOPE" == all ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          else
            BASE="$BEFORE_SHA"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=ACMRT "$BASE" HEAD > changed-files.txt
          cat changed-files.txt
          if [[ ! -s changed-files.txt ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eq '^(src/|tests/|build/|labs/|playground/|public/|migration/|package(-lock)?\.json$|tsconfig|vite\.config\.|\.github/workflows/)' changed-files.txt; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # Build tooling, shared runtime and dependency changes can affect every script.
          if grep -Eq '^(build/|src/(runtime/|core/|config/|styles/|selectors\.|assets/)|package(-lock)?\.json$|vite\.config\.|tsconfig|migration/)' changed-files.txt; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: npm ci --legacy-peer-deps
      - name: Validate affected code
        if: steps.plan.outputs.run == 'true'
        shell: bash
        env:
          FULL: ${{ steps.plan.outputs.full }}
        run: |
          set -euo pipefail
          if [[ "$FULL" == true ]]; then
            echo "Shared infrastructure changed: running full validation."
            npm run typecheck
            npm run lint
            npm run build
            npx vitest run --maxWorkers=2 --exclude '**/runtime-startup-benchmark.test.js'
            npm run test:lab
            node build/hosting.mjs
            exit 0
          fi
          mapfile -t files < changed-files.txt
          source_changed=false
          tests_changed=false
          build_needed=false
          lab_changed=false
          hosting_changed=false
          for file in "${files[@]}"; do
            case "$file" in
              src/*) source_changed=true; build_needed=true ;;
              tests/*.test.*) tests_changed=true ;;
              labs/*) lab_changed=true ;;
              playground/*|public/*) hosting_changed=true; build_needed=true ;;
            esac
          done
          if [[ "$source_changed" == true ]]; then
            npm run typecheck
            npm run lint
            # The userscript bundle is shared, so source changes require a build.
            # Vitest --related selects tests importing changed modules. Integration
            # fixtures consume dist/ indirectly, so include them for userscript edits.
            mapfile -t changed_sources < <(printf '%s\n' "${files[@]}" | grep '^src/' || true)
            if (( ${#changed_sources[@]} )); then
              npx vitest related "${changed_sources[@]}" --run --maxWorkers=2 --passWithNoTests --exclude '**/runtime-startup-benchmark.test.js'
            fi
            if printf '%s\n' "${files[@]}" | grep -Eq '^src/userscripts/'; then
              npx vitest run tests/integrated-userscripts.test.js --maxWorkers=2
            fi
          fi
          if [[ "$build_needed" == true ]]; then npm run build; fi
          if [[ "$tests_changed" == true ]]; then
            mapfile -t changed_tests < <(printf '%s\n' "${files[@]}" | grep -E '^tests/.*\.test\.[cm]?[jt]sx?$' || true)
            if (( ${#changed_tests[@]} )); then
              # Some integration tests read dist/ rather than importing source.
              if [[ "$build_needed" != true ]] && printf '%s\n' "${changed_tests[@]}" | grep -Eq '(integrated|boot|standalone).*\.test\.'; then
                npm run build
                build_needed=true
              fi
              npx vitest run "${changed_tests[@]}" --maxWorkers=2
            fi
          fi
          if [[ "$lab_changed" == true ]]; then npm run test:lab; fi
          if [[ "$hosting_changed" == true ]]; then
            node build/hosting.mjs
          fi
          {
            echo "### Selective validation"
            echo 'Changed files:'
            sed 's/^/- `/; s/$/`/' changed-files.txt
          } >> "$GITHUB_STEP_SUMMARY"
