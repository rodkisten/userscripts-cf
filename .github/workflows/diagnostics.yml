name: Validate changed userscripts
run-name: "Validate changed · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope"
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: read

concurrency:
  group: userscripts-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate affected files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Detect changes and plan validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || 'changed' }}
        run: bash build/validate-changed.sh plan
      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: npm ci --legacy-peer-deps
      - name: Validate affected code
        if: steps.plan.outputs.run == 'true'
        shell: bash
        env:
          FULL: ${{ steps.plan.outputs.full }}
        run: bash build/validate-changed.sh run
