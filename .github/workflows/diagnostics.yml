name: Validate changed userscripts
run-name: "Validate changed · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope"
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: read
  actions: write

concurrency:
  group: userscripts-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v6
      - id: ids
        shell: bash
        run: |
          echo "ids=$(node --input-type=module -e 'import definitions from "./userscripts.config.js"; console.log(JSON.stringify(definitions.map(d => d.id)))')" >> "$GITHUB_OUTPUT"
  script-tests:
    needs: discover
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.ids) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Calculate dependency fingerprint
        id: fingerprint
        env:
          SCRIPT_ID: ${{ matrix.id }}
        run: |
          node build/validation-fingerprints.mjs --output=fingerprints.json
          echo "hash=$(node -e 'console.log(require("./fingerprints.json")[process.env.SCRIPT_ID].hash)')" >> "$GITHUB_OUTPUT"
          echo "tests=$(node -e 'console.log(require("./fingerprints.json")[process.env.SCRIPT_ID].tests.length)')" >> "$GITHUB_OUTPUT"
      - name: Restore userscript lint result
        id: lint_cached
        uses: actions/cache/restore@v4
        with:
          path: .validation-cache/lint/${{ matrix.id }}/passed
          key: script-lint-v2-${{ runner.os }}-node24-${{ matrix.id }}-${{ steps.fingerprint.outputs.hash }}
      - name: Check uncached userscript lint
        if: steps.lint_cached.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node build/check-style.mjs --script="${{ matrix.id }}"
          mkdir -p ".validation-cache/lint/${{ matrix.id }}"
          echo passed > ".validation-cache/lint/${{ matrix.id }}/passed"
      - name: Save successful userscript lint
        if: steps.lint_cached.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .validation-cache/lint/${{ matrix.id }}/passed
          key: script-lint-v1-${{ runner.os }}-node24-${{ matrix.id }}-${{ steps.fingerprint.outputs.hash }}
      - name: Restore userscript test result
        if: steps.fingerprint.outputs.tests != '0'
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: .validation-cache/scripts/${{ matrix.id }}/passed
          key: script-tests-v1-${{ runner.os }}-node24-${{ matrix.id }}-${{ steps.fingerprint.outputs.hash }}
      - name: Build and test uncached userscript
        if: steps.fingerprint.outputs.tests != '0' && steps.cached.outputs.cache-hit != 'true'
        env:
          SCRIPT_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          mapfile -t tests < <(node -e 'console.log(require("./fingerprints.json")[process.env.SCRIPT_ID].tests.join("\\n"))')
          npx vitest run "${tests[@]}" --maxWorkers=2 --exclude '**/runtime-startup-benchmark.test.js'
          mkdir -p ".validation-cache/scripts/$SCRIPT_ID"
          echo "passed" > ".validation-cache/scripts/$SCRIPT_ID/passed"
      - name: Save successful userscript result
        if: steps.fingerprint.outputs.tests != '0' && steps.cached.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .validation-cache/scripts/${{ matrix.id }}/passed
          key: script-tests-v1-${{ runner.os }}-node24-${{ matrix.id }}-${{ steps.fingerprint.outputs.hash }}
  validate:
    name: "Validate affected files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Detect changes and plan validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || 'changed' }}
        run: bash build/validate-changed.sh plan
      - name: Install dependencies
        id: install
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        run: npm ci --legacy-peer-deps
      - name: Dispatch lockfile repair when installation fails
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run repair-lockfile.yml --ref "$BRANCH"
          echo "Lockfile repair requested for $BRANCH. Its commit will trigger a new validation." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail current validation on installation error
        if: steps.install.outcome == 'failure'
        run: exit 1
      - name: Check formatting
        id: formatting
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          printf '\\n.github/workflows/**\\n' >> .prettierignore
          npx prettier --check .
          git restore -- .prettierignore
      - name: Dispatch formatting repair
        if: steps.formatting.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run prettier-full.yml --ref "$BRANCH" -f target_branch="$BRANCH" -f create_pr=false
          echo "Formatting repair requested for $BRANCH; its commit will trigger validation again." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail current validation on formatting error
        if: steps.formatting.outcome == 'failure'
        run: exit 1
      - name: Restore exact-source validation result
        id: validation_cache
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.formatting.outcome == 'success' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .validation-cache/passed
          key: userscripts-validation-v2-${{ runner.os }}-node24-${{ hashFiles('src/**', 'tests/**', 'build/**', 'labs/**', 'playground/**', 'public/**', 'migration/**', 'userscripts.config.js', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.js', '.github/workflows/diagnostics.yml') }}
      - name: Validate affected code
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.formatting.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FULL: ${{ steps.plan.outputs.full }}
          SCRIPT_TESTS_SEPARATE: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'all' }}
        run: bash build/validate-changed.sh run
      - name: Record successful exact-source validation
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.formatting.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true' && success()
        shell: bash
        run: |
          mkdir -p .validation-cache
          printf '%s\n' "Validation passed for exact source fingerprint" > .validation-cache/passed
      - name: Save successful exact-source validation
        if: steps.validation_cache.outputs.cache-hit != 'true' && steps.plan.outputs.run == 'true' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch' && success()
        uses: actions/cache/save@v4
        with:
          path: .validation-cache/passed
          key: ${{ steps.validation_cache.outputs.cache-primary-key }}
      - name: Report reused validation
        if: steps.validation_cache.outputs.cache-hit == 'true'
        run: echo "Reused successful validation for identical source, tests and configuration fingerprint." >> "$GITHUB_STEP_SUMMARY"
