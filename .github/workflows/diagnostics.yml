name: Diagnose all userscripts failures
run-name: "Diagnostics · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscripts-diagnostics-${{ github.ref }}
  # Preserve complete diagnostics until the checks finish.
  cancel-in-progress: false

jobs:
  diagnose:
    name: "${{ matrix.check }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            command: npm run typecheck
          # The integration suite consumes dist/, so build it once in this job.
          # Hosting already runs the production build; no duplicate build-only job.
          - check: unit-tests
            command: npm run build && npx vitest run --maxWorkers=2 --exclude '**/runtime-startup-benchmark.test.js'
          - check: lab
            command: npm run test:lab
          - check: hosting
            command: npm run build:hosting
          - check: lint
            command: npm run lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          npm ci --legacy-peer-deps
      - name: Run ${{ matrix.check }} and capture complete output
        id: check
        shell: bash
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: |
          set +e
          bash -o pipefail -c "$CHECK_COMMAND" 2>&1 | tee "diagnostic-${{ matrix.check }}.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.check }}: $([[ "$status" == 0 ]] && echo PASS || echo FAIL)"
            echo '~~~text'
            echo "Exit code: $status"
            echo "Full logs are attached as artifacts; the excerpt below is only a quick index."
            grep -E 'error TS[0-9]+|\\[MISSING_EXPORT\\]|(^| )Error:|npm error|FAIL|failed|✗|AssertionError|Test Files|Tests ' "diagnostic-${{ matrix.check }}.log" | tail -120 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.check }}
          path: diagnostic-${{ matrix.check }}.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Mark check failed after collecting logs
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
