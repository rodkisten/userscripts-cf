name: Validate changed userscripts
run-name: "Validate changed · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope"
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: read
  actions: write

concurrency:
  group: userscripts-validate-${{ github.event.pull_request.number || github.ref }}
  # Keep the active PR validation alive; newer synchronize events wait instead of killing its runner.
  cancel-in-progress: false

jobs:
  validate:
    name: "Validate affected files"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      scoped_matrix: ${{ steps.plan.outputs.matrix || '[]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Detect changes and plan validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || 'changed' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash build/validate-changed.sh plan
      - name: Install dependencies
        id: install
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        run: npm ci --legacy-peer-deps
      - name: Dispatch lockfile repair when installation fails
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run repair-lockfile.yml --ref "$BRANCH"
          echo "Lockfile repair requested for $BRANCH. Its commit will trigger a new validation." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail current validation on installation error
        if: steps.install.outcome == 'failure'
        run: exit 1
      - name: "🧬 Repair and verify repository-wide TS/TSX syntax"
        id: react_syntax
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npm run check:react-syntax:fix
          mapfile -d '' changed < <(git diff --name-only -z -- '*.ts' '*.tsx' '*.mts' '*.cts')
          if (( ${#changed[@]} )); then
            npx prettier --write "${changed[@]}"
          fi
          npm run check:react-syntax
          if git diff --quiet -- '*.ts' '*.tsx' '*.mts' '*.cts'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "🤖 Authenticate bot for verified syntax repair"
        id: syntax_bot
        if: steps.react_syntax.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: "🚀 Commit and push verified syntax repairs"
        if: steps.react_syntax.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          BOT_TOKEN: ${{ steps.syntax_bot.outputs.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.ts' '*.tsx' '*.mts' '*.cts'; then
            echo "No syntax repairs needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$PR_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Automatic pushes to fork PRs are disabled."
            exit 1
          fi
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | cut -f1)"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" && "$REMOTE_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Branch advanced while repair was running. Refusing stale push."
            exit 1
          fi
          git config user.name "rod-bot[bot]"
          git config user.email "rod-bot[bot]@users.noreply.github.com"
          git add -- '*.ts' '*.tsx' '*.mts' '*.cts'
          git commit -m "fix(react): repair invalid source newlines"
          git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${PR_BRANCH}"
          echo "Verified syntax repairs committed to ${PR_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
      - name: Check formatting
        id: formatting
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          printf '%s\n' '.github/workflows/**' > .prettierignore
          npx prettier --check .
          rm -f .prettierignore
      - name: Report formatting without blocking validation
        if: steps.formatting.outcome == 'failure'
        run: |
          {
            echo "### ⚠️ Formatting differences detected (non-blocking)"
            echo "Prettier found differences. No automatic commit or new workflow is triggered during validation."
            echo "Tests and release validation continue independently of formatting."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore exact-source validation result
        id: validation_cache
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch' && !contains(github.event.pull_request.title, '(test:') && !contains(github.event.pull_request.title, '(build:')
        uses: actions/cache/restore@v4
        with:
          path: .validation-cache/passed
          key: userscripts-validation-v2-${{ runner.os }}-node24-${{ hashFiles('src/**', 'tests/**', 'build/**', 'labs/**', 'playground/**', 'public/**', 'migration/**', 'userscripts.config.js', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.js', '.github/workflows/diagnostics.yml') }}
      - name: Validate affected code
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FULL: ${{ steps.plan.outputs.full }}
          SCRIPT_TESTS_SEPARATE: false
          SCOPED_BUILDS_MATRIX: true
          RUNTIME_TEST_SKIP_DIST: 'true'
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash build/validate-changed.sh run
      # The playground is a visual preview, not a typecheck gate.
      # Always attempt its single build even when TypeScript validation fails.
      - name: Build visual playground (independent of typecheck)
        if: always() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        run: node build/design-system.mjs
      - name: Record successful exact-source validation
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true' && success()
        shell: bash
        run: |
          mkdir -p .validation-cache
          printf '%s\n' "Validation passed for exact source fingerprint" > .validation-cache/passed
      - name: Save successful exact-source validation
        if: steps.validation_cache.outputs.cache-hit != 'true' && steps.plan.outputs.run == 'true' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch' && success()
        uses: actions/cache/save@v4
        with:
          path: .validation-cache/passed
          key: ${{ steps.validation_cache.outputs.cache-primary-key }}
      - name: Report reused validation
        if: steps.validation_cache.outputs.cache-hit == 'true'
        run: echo "Reused successful validation for identical source, tests and configuration fingerprint." >> "$GITHUB_STEP_SUMMARY"


  scoped-builds:
    name: "Scoped build · ${{ matrix.target }}"
    needs: validate
    if: ${{ always() && github.event_name == 'pull_request' && needs.validate.outputs.scoped_matrix != '[]' && needs.validate.outputs.scoped_matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.validate.outputs.scoped_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build selected userscript
        env:
          TARGET: ${{ matrix.target }}
        run: node build/build.mjs "--targets=$TARGET"
