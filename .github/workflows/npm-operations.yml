name: 🔒 Package Manager Operations

run-name: "📦 ${{ inputs.runner || 'npm' }} ${{ inputs.operation == 'custom' && inputs.arguments || inputs.operation || 'install' }} on 🌿 ${{ inputs.selected-branch || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      selected-branch:
        description: 'Target branch'
        type: string
        default: 'main'
        required: false
      runner:
        description: 'Package manager / executor'
        required: true
        default: 'npm'
        type: choice
        options:
          - npm
          - pnpm
          - npx
          - pnpx
      operation:
        description: 'Operation to execute'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - add
          - update
          - uninstall
          - custom
      arguments:
        description: 'Custom arguments/command (ONLY used when operation is "custom")'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pkg-operations-${{ inputs.selected-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: 🛠️ ${{ inputs.runner }} ${{ inputs.operation }} (${{ inputs.selected-branch || github.ref_name }})
    outputs:
      changed: ${{ steps.generated_output.outputs.changed }}
      branch: ${{ steps.generated_output.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: 📦 Setup pnpm (if selected)
        if: inputs.runner == 'pnpm' || inputs.runner == 'pnpx'
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ (inputs.runner == 'pnpm' || inputs.runner == 'pnpx') && 'pnpm' || 'npm' }}

      - name: 🪵 Verify branch and synchronize
        if: (inputs.selected-branch || github.ref_name) != 'main'
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

      - name: ⚡ Run ${{ inputs.runner }} ${{ inputs.operation }}
        shell: bash
        env:
          RUNNER: ${{ inputs.runner }}
          OP: ${{ inputs.operation }}
          ARGS: ${{ inputs.arguments }}
        run: |
          set -euo pipefail
          
          if [ "$OP" = "custom" ]; then
            if [ -z "$ARGS" ]; then
              echo "❌ Error: 'arguments' input is required when operation is 'custom'."
              exit 1
            fi
            echo "🚀 Running custom command: $RUNNER $ARGS"
            $RUNNER $ARGS
          else
            if [ -n "$ARGS" ]; then
              echo "⚠️ Warning: 'arguments' are ignored unless operation is 'custom'."
            fi
            
            if [ "$RUNNER" = "npx" ] || [ "$RUNNER" = "pnpx" ]; then
              echo "❌ Error: '$RUNNER' requires operation to be set to 'custom'."
              exit 1
            fi

            if [ "$RUNNER" = "npm" ]; then
              if [ "$OP" = "install" ]; then
                npm ci --legacy-peer-deps --no-audit --no-fund
              else
                npm "$OP" --legacy-peer-deps --no-audit --no-fund
              fi
            elif [ "$RUNNER" = "pnpm" ]; then
              if [ "$OP" = "install" ]; then
                pnpm install --frozen-lockfile
              else
                pnpm "$OP"
              fi
            fi
          fi

      - name: 💾 Commit changes
        id: generated_output
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          RUNNER: ${{ inputs.runner }}
          OP: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          
          # Verifica mudanças no package.json, package-lock.json ou pnpm-lock.yaml
          if git diff --quiet -- package.json package-lock.json pnpm-lock.yaml 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No dependency files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@://github.com"
          
          git add package.json
          [ -f package-lock.json ] && git add package-lock.json
          [ -f pnpm-lock.yaml ] && git add pnpm-lock.yaml
          
          git commit -m "chore(deps): run $RUNNER $OP"
          git push origin "HEAD:$BRANCH"
          
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "🚀 Executed $RUNNER $OP and pushed changes to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
