name: 🥊 Package & Shell Operations

run-name: "🥊 ${{ inputs.operation == 'custom' && inputs.custom-command || format('{0} ⬩ {1}', inputs.operation, inputs.packages) }} on 🌿 ${{ inputs.selected-branch || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      selected-branch:
        description: 'Target branch'
        type: string
        default: 'main'
        required: false
      operation:
        description: 'Operation to execute'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - add
          - update
          - uninstall
          - custom
      packages:
        description: 'Package list or command (e.g. "zod axios -D" or "zod -D && npm run build")'
        type: string
        required: false
        default: ''
      custom-command:
        description: 'Optional shell command (runs standalone if "custom", or chained after packages)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pkg-operations-${{ inputs.selected-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: 🥊 ${{ inputs.operation }} (${{ inputs.selected-branch || github.ref_name }})
    outputs:
      changed: ${{ steps.run_op.outputs.changed }}
      branch: ${{ steps.run_op.outputs.branch }}
      commit_sha: ${{ steps.run_op.outputs.commit_sha }}
      pr_number: ${{ steps.run_op.outputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.selected-branch || github.ref_name }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🥊 Run operation
        id: run_op
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_CUSTOM_CMD: ${{ inputs.custom-command }}
        run: node scripts/operation.mjs
