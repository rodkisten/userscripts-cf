name: 🥊 NPM operations

run-name: "📦 npm ${{ inputs.operation || 'install' }} on 🌿 ${{ inputs.selected-branch || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      selected-branch:
        description: 'Target branch'
        type: string
        default: 'main'
        required: false
      operation:
        description: 'Operation to npm'
        required: true
        default: 'install'
        type: choice
        options:
          - add
          - install
          - update
          - uninstall
      packages:
        description: 'Package name(s) (required for add/uninstall)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: npm-operations-${{ inputs.selected-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    name: 🛠️ NPM ${{ inputs.operation }} (${{ inputs.selected-branch || github.ref_name }})
    outputs:
      changed: ${{ steps.generated_output.outputs.changed }}
      branch: ${{ steps.generated_output.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 🪵 Verify branch and synchronize
        if: (inputs.selected-branch || github.ref_name) != 'main'
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

      - name: ⚡ Run npm ${{ inputs.operation }}
        shell: bash
        env:
          OP: ${{ inputs.operation }}
          PKGS: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [ "$OP" = "add" ] || [ "$OP" = "uninstall" ]; then
            if [ -z "$PKGS" ]; then
              echo "❌ Error: 'packages' input is required for '$OP' operation."
              exit 1
            fi
            npm "$OP" $PKGS --legacy-peer-deps --no-audit --no-fund
          elif [ "$OP" = "install" ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm "$OP" --legacy-peer-deps --no-audit --no-fund
          fi

      - name: 💾 Commit regenerated lockfile
        id: generated_output
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          OP: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Lockfile already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): run npm $OP"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "🚀 Executed npm $OP and pushed changes to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
