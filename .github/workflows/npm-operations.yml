name: 🥊 Package & Shell Operations

run-name: "🥊 ${{ inputs.operation == 'custom' && inputs.custom-command || inputs.operation || 'install' }} on 🌿 ${{ inputs.selected-branch || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      selected-branch:
        description: 'Target branch'
        type: string
        default: 'main'
        required: false
      operation:
        description: 'Operation to execute'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - update
          - custom
      custom-command:
        description: 'Any shell command (ONLY used when operation is "custom")'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pkg-operations-${{ inputs.selected-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: 🥊 ${{ inputs.operation }} (${{ inputs.selected-branch || github.ref_name }})
    outputs:
      changed: ${{ steps.generated_output.outputs.changed }}
      branch: ${{ steps.generated_output.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: 🪵 Verify branch and synchronize
        if: (inputs.selected-branch || github.ref_name) != 'main'
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

      - name: 🔍 Detect package manager (npm or pnpm)
        id: detect-pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "📦 Detected: pnpm (pnpm-lock.yaml found)"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "📦 Detected: npm"
          fi

      - name: 📦 Setup pnpm (auto)
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ steps.detect-pm.outputs.pm }}

      - name: 🥊 Run ${{ inputs.operation }}
        shell: bash
        env:
          PM: ${{ steps.detect-pm.outputs.pm }}
          OP: ${{ inputs.operation }}
          CMD: ${{ inputs.custom-command }}
        run: |
          set -euo pipefail
          
          if [ "$OP" = "custom" ]; then
            if [ -z "$CMD" ]; then
              echo "❌ Error: 'custom-command' is required when operation is 'custom'."
              exit 1
            fi
            echo "🥊 Executing custom shell command: $CMD"
            eval "$CMD"
          else
            if [ -n "$CMD" ]; then
              echo "⚠️ Warning: 'custom-command' is ignored because operation is '$OP'."
            fi

            echo "🥊 Executing $PM $OP..."
            if [ "$PM" = "pnpm" ]; then
              if [ "$OP" = "install" ]; then
                pnpm install --frozen-lockfile
              else
                pnpm "$OP"
              fi
            else
              if [ "$OP" = "install" ]; then
                npm ci --legacy-peer-deps --no-audit --no-fund
              else
                npm "$OP" --legacy-peer-deps --no-audit --no-fund
              fi
            fi
          fi

      - name: 💾 Commit changes
        id: generated_output
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          PM: ${{ steps.detect-pm.outputs.pm }}
          OP: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          
          # Verifica se houve alteração em qualquer arquivo rastreado ou novo
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@://github.com"
          
          git add -A
          git commit -m "chore: run $OP ($PM)"
          git push origin "HEAD:$BRANCH"
          
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "🥊 Executed $OP and pushed changes to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
