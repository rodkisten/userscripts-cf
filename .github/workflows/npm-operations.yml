name: 🥊 Package & Shell Operations

run-name: "🥊 ${{ inputs.operation == 'custom' && inputs.custom-command || format('{0} {1}', inputs.operation, inputs.packages) }} on 🌿 ${{ inputs.selected-branch || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      selected-branch:
        description: 'Target branch'
        type: string
        default: 'main'
        required: false
      operation:
        description: 'Operation to execute'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - add
          - update
          - uninstall
          - custom
      packages:
        description: 'Package list (for add/uninstall, e.g. "zod axios -D")'
        type: string
        required: false
        default: ''
      custom-command:
        description: 'Any shell command (ONLY used when operation is "custom")'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pkg-operations-${{ inputs.selected-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: 🥊 ${{ inputs.operation }} (${{ inputs.selected-branch || github.ref_name }})
    outputs:
      changed: ${{ steps.generated_output.outputs.changed }}
      branch: ${{ steps.generated_output.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Kitchen Sink - GitHub Summary Markdown
       uses: actions/github-script@v7
       with:
       script: |
        await core.summary
          // 1. Títulos (níveis 1 a 6, padrão é 1)
          .addHeading('Relatório Completo (Kitchen Sink) 🚀', 1)
          .addHeading('Subtítulo de Seção', 2)

          // 2. Textos e parágrafos
          .addRaw('Texto puro sem quebra de linha automática. ')
          .addRaw('Texto com quebra de linha (EOL) no final.', true)
          .addBreak() // Adiciona uma linha em branco (<br>)
          .addEOL()   // Adiciona apenas um caractere de nova linha (\n)

          // 3. Citações (Blockquotes) e Separadores
          .addQuote('Deploy realizado com sucesso em produção.', 'Autor ou Fonte (opcional)')
          .addSeparator() // Linha horizontal (<hr>)

          // 4. Links e Imagens
          .addLink('Acessar Documentação do GitHub', 'https://github.com')
          .addBreak()
          .addImage(
            'https://githubassets.com',
            'Logo do GitHub',
            { width: '64', height: '64' } // Opções de dimensão
          )

          // 5. Listas (false = não ordenada / bullets, true = ordenada / numerada)
          .addHeading('Checklist de Verificação', 3)
          .addList(['Lint aprovado', 'Testes unitários OK', 'Build gerado'], false)
          .addList(['Primeiro passo', 'Segundo passo', 'Terceiro passo'], true)

          // 6. Blocos de Código (com syntax highlighting)
          .addHeading('Exemplo de Payload', 3)
          .addCodeBlock(
            JSON.stringify({ status: 'ok', version: '2.1.0', env: 'prod' }, null, 2),
            'json'
          )

          // 7. Tabelas (suporta células simples ou objetos com header, colspan e rowspan)
          .addHeading('Métricas dos Serviços', 3)
          .addTable([
            [
              { data: 'Serviço', header: true },
              { data: 'Latência', header: true },
              { data: 'Status', header: true }
            ],
            ['Auth API', '45ms', '✅ Online'],
            ['Billing Worker', '120ms', '⚠️ Lento'],
            [{ data: 'Todos os sistemas monitorados via Prometheus', colspan: '3' }]
          ])

          // 8. Acordeão / Seção expansível (<details>)
          .addDetails(
            'Clique para ver os logs brutos',
            'INFO [2026-11-19]: Processo finalizado em 1.42s sem erros.'
          )

          // 9. Métodos de controle e saída
          // .stringify() -> Retorna a string gerada sem salvar ainda (útil para comentar em PRs)
          // .isEmptyBuffer() -> Retorna true/false se o buffer estiver vazio
          // .emptyBuffer() -> Limpa tudo o que foi montado antes de escrever
          // .clear() -> Apaga o arquivo de resumo existente e limpa o buffer
          .write() // Grava no $GITHUB_STEP_SUMMARY (use { overwrite: true } para sobrescrever)




      - name: 🔑 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: 🪵 Verify branch and synchronize
        if: (inputs.selected-branch || github.ref_name) != 'main'
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

      - name: 🔍 Detect package manager (npm or pnpm)
        id: detect-pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "📦 Detected: pnpm (pnpm-lock.yaml found)"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "📦 Detected: npm"
          fi

      - name: 📦 Setup pnpm (auto)
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ steps.detect-pm.outputs.pm }}

      - name: 🥊 Run ${{ inputs.operation }}
        shell: bash
        env:
          PM: ${{ steps.detect-pm.outputs.pm }}
          OP: ${{ inputs.operation }}
          PKGS: ${{ inputs.packages }}
          CMD: ${{ inputs.custom-command }}
        run: |
          set -euo pipefail
          
          # Modo Custom (qualquer comando de shell)
          if [ "$OP" = "custom" ]; then
            if [ -z "$CMD" ]; then
              echo "❌ Error: 'custom-command' is required when operation is 'custom'."
              exit 1
            fi
            [ -n "$PKGS" ] && echo "⚠️ Warning: 'packages' input is ignored in 'custom' mode."
            echo "🥊 Executing custom shell command: $CMD"
            eval "$CMD"
            exit 0
          fi

          # Aviso se custom-command foi preenchido fora do modo custom
          if [ -n "$CMD" ]; then
            echo "⚠️ Warning: 'custom-command' is ignored because operation is '$OP'."
          fi

          # Validação da lista de pacotes para add e uninstall
          if [ "$OP" = "add" ] || [ "$OP" = "uninstall" ]; then
            if [ -z "$PKGS" ]; then
              echo "❌ Error: 'packages' list is required for '$OP' operation."
              exit 1
            fi
          fi

          # Execução com pnpm
          if [ "$PM" = "pnpm" ]; then
            if [ "$OP" = "install" ]; then
              pnpm install --frozen-lockfile
            elif [ "$OP" = "add" ] || [ "$OP" = "uninstall" ]; then
              pnpm "$OP" $PKGS
            else
              pnpm "$OP" $PKGS
            fi

          # Execução com npm
          else
            if [ "$OP" = "install" ]; then
              npm ci --legacy-peer-deps --no-audit --no-fund
            elif [ "$OP" = "add" ]; then
              npm install $PKGS --legacy-peer-deps --no-audit --no-fund
            elif [ "$OP" = "uninstall" ]; then
              npm uninstall $PKGS --legacy-peer-deps --no-audit --no-fund
            else
              npm update $PKGS --legacy-peer-deps --no-audit --no-fund
            fi
          fi

      - name: 💾 Commit changes
        id: generated_output
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          PM: ${{ steps.detect-pm.outputs.pm }}
          OP: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@://github.com"
          
          git add -A
          git commit -m "chore: run $OP ($PM)"
          git push origin "HEAD:$BRANCH"
          
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "🥊 Executed $OP and pushed changes to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
