name: Deploy playground to GitHub Pages
run-name: "Playground Pages · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "playground/**"
      - "build/**"
      - "hosting/**"
      - "assets/**"
      - "userscripts.config.js"
      - "distribution.config.js"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/playground-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: userscripts-playground-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://userscripts-playground.migos.club/
    steps:
      - uses: actions/checkout@v6
      - name: Identify push actor and commit author
        if: github.event_name == 'push'
        env:
          PUSH_ACTOR: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.username }}
          COMMIT_COMMITTER: ${{ github.event.head_commit.committer.username }}
        run: |
          set -euo pipefail
          echo "### 🚀 Preview trigger identity" >> "$GITHUB_STEP_SUMMARY"
          echo "Actor: \`$PUSH_ACTOR\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Author: \`${COMMIT_AUTHOR:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Committer: \`${COMMIT_COMMITTER:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUSH_ACTOR" == "ploocky[bot]" ]]; then
            echo "🤖 Ploocky App push authenticated; deploying preview." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUSH_ACTOR" == *'[bot]' ]]; then
            echo "🤖 Other GitHub bot: $PUSH_ACTOR; standard push deploy remains enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "👤 Human push; standard preview deploy remains enabled." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start build timing
        run: echo "PAGES_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore installed dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: pages-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'package.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Verify React-only dependencies
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const required = ['vite', 'typescript', 'react', 'react-dom'];
          for (const name of required) {
            const path = `node_modules/${name}/package.json`;
            if (!fs.existsSync(path)) throw Error(`Missing dependency: ${name}`);
            const { version } = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(`${name}: ${version}`);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['solid-js', '@solidjs/vite-plugin', '@solidjs/compiler']) {
            if (pkg.dependencies?.[name] || pkg.devDependencies?.[name]) {
              throw Error(`Legacy Solid dependency must not be restored: ${name}`);
            }
          }
          NODE
      # Playground preview is independent of lint, typecheck and release checks.
      # Cache only the userscript distribution, not the playground assets.
      # UI-only changes can reuse these bundles without running the expensive
      # multi-target Vite build. Changes to source/build/config invalidate it.
      - name: Restore compiled userscripts
        id: bundles
        uses: actions/cache@v4
        with:
          path: |
            dist/*.user.js
            dist/*.meta.js
            dist/manifest.json
            dist/SHA256SUMS
            dist/icons/*.svg
          key: pages-bundles-v2-${{ hashFiles('src/**', 'build/**', '!build/hosting.mjs', '!build/design-system.mjs', '!build/preview-userscripts.mjs', 'userscripts.config.js', 'distribution.config.js', 'vite.config.js', 'package.json', 'package-lock.json', 'assets/**') }}
      - name: Build userscripts (cache miss)
        if: steps.bundles.outputs.cache-hit != 'true'
        run: DEBUG=vite:* npm run build
      - name: Verify cached distribution before preview
        run: |
          set -euo pipefail
          test -s dist/manifest.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
          if (!Array.isArray(manifest.scripts) || !manifest.scripts.length) throw Error("Empty distribution cache");
          for (const script of manifest.scripts) {
            for (const name of [script.file, script.metaFile]) {
              if (!name || !fs.existsSync("dist/" + name) || fs.statSync("dist/" + name).size === 0) {
                throw Error("Missing distribution artifact: " + name);
              }
            }
          }
          console.log("Verified " + manifest.scripts.length + " installers");
          NODE
      - name: Report bundle cache
        run: |
          if [[ "${{ steps.bundles.outputs.cache-hit }}" == "true" ]]; then
            echo "⚡ Reusing cached userscript installers; skipping full Vite distribution build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📦 Distribution cache miss; built userscripts from source" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare isolated preview installers
        env:
          USERSCRIPTS_PREVIEW_URL: https://userscripts-playground.migos.club
        run: node build/preview-userscripts.mjs
      - name: Restore design-system build
        id: design-system
        uses: actions/cache@v4
        with:
          path: dist/design-system.js
          key: pages-design-system-v1-${{ hashFiles('studio/**', 'src/**', 'build/design-system.mjs', 'build/css-modules.mjs', 'build/styles.mjs', 'build/runtime-helpers.mjs', 'build/svg.mjs', 'vite.config.js', 'package.json', 'package-lock.json') }}
      - name: Generate static playground
        env:
          USERSCRIPTS_PREVIEW: "1"
          USERSCRIPTS_REUSE_DESIGN_SYSTEM: "${{ steps.design-system.outputs.cache-hit }}"
        run: node build/hosting.mjs
      - name: Report pipeline timings
        if: always()
        run: |
          {
            echo "### ⚡ Playground build diagnostics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Dependencies cache | ${{ steps.node-modules.outputs.cache-hit || 'miss' }} |"
            echo "| Distribution cache | ${{ steps.bundles.outputs.cache-hit || 'miss' }} |"
            echo "| Design system cache | ${{ steps.design-system.outputs.cache-hit || 'miss' }} |"
            echo "| Time to static output | $(( $(date +%s) - PAGES_STARTED_AT )) seconds |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate static Pages output
        run: |
          set -euo pipefail
          test -s dist/pages/index.html
          test -s dist/pages/manifest.json
          test -s dist/pages/playground/instagram-bookmark.html
          test -s dist/pages/playground/instagram-bookmark.js
          test -s dist/pages/playground/form-controls.html
          test -s dist/pages/playground/form-controls.js
          test -s dist/pages/playground/form-controls.js.map
          test -s dist/pages/icons/preview.svg
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "dist/pages/";
          const manifest = JSON.parse(fs.readFileSync(root + "manifest.json", "utf8"));
          if (manifest.channel !== "preview" || !manifest.scripts.length) throw Error("Missing preview catalog");
          for (const item of manifest.scripts) {
            if (!item.file.endsWith(".preview.user.js") || !item.metaFile.endsWith(".preview.meta.js")) throw Error("Invalid preview filenames: " + item.id);
            const source = fs.readFileSync(root + item.file, "utf8");
            const meta = fs.readFileSync(root + item.metaFile, "utf8");
            for (const [name, content] of [["script", source], ["metadata", meta]]) {
              if (!content.split("\n").some(line => line.startsWith("// @name") && line.includes("[PRE] "))) throw Error("Missing PRE name in " + item.id + " " + name);
              if (!content.includes("/" + item.file) || !content.includes("/" + item.metaFile)) throw Error("Incorrect preview links in " + item.id + " " + name);
              if (!content.includes("/icons/preview.svg")) throw Error("Missing black preview icon in " + item.id + " " + name);
            }
          }
          console.log("Verified " + manifest.scripts.length + " preview installers and static assets");
          NODE
      - uses: actions/configure-pages@v5
      # A retry of this run must not collide with its previous Pages artifact.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
          name: github-pages-${{ github.run_attempt }}
      - name: Reject outdated build before publishing
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::error::Outdated workflow: current main is $latest, run started at $GITHUB_SHA"
            exit 1
          fi
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Summary
        run: |
          echo "### Playground published on GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "https://userscripts-playground.migos.club/" >> "$GITHUB_STEP_SUMMARY"
