name: "🤖 Ploocky · Marker preview trigger"
run-name: "🤖 Ploocky · Check @ploocky commits"

on:
  push: 
    branches:
      - main
 # schedule:
 #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ploocky-marker-preview
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
      - name: Find unpublished @ploocky commits
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          # The latest Ploocky trigger commit is the watermark. Every marked
          # commit after it is published by the next authenticated empty push.
          # Consume all Git output so awk never closes the pipe early (SIGPIPE 141).
          marker="$(git log -100 --format='%H%x09%s' | awk -F '\t' '
            !done && $2 ~ /^chore\(preview\): trigger Ploocky deploy for / { done = 1; next }
            !done && $2 ~ /@ploocky$/ { marker = $1; done = 1 }
            END { if (marker != "") print marker }
          ')"
          if [[ -n "$marker" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$marker" >> "$GITHUB_OUTPUT"
            echo "Detected unpublished marker: $marker" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No unpublished @ploocky marker in recent main commits." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Authenticate Ploocky
        if: steps.marker.outputs.pending == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure authenticated push remote
        if: steps.marker.outputs.pending == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local credential.helper '!f() { echo username=x-access-token; echo "password=$APP_TOKEN"; }; f'
      - name: Trigger Pages through authenticated Ploocky push
        if: steps.marker.outputs.pending == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ steps.marker.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APP_SLUG" != "ploocky" ]]; then
            echo "::error::Expected GitHub App ploocky, got $APP_SLUG"
            exit 1
          fi
          git config user.name "ploocky[bot]"
          git config user.email "ploocky[bot]@users.noreply.github.com"
          # Refuse to publish a stale snapshot if main moved since checkout.
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::notice::main advanced; next scheduled check will retry"
            exit 0
          fi
          git commit --allow-empty -m "chore(preview): trigger Ploocky deploy for $SOURCE_SHA"
          git push origin HEAD:main
          echo "🤖 Ploocky pushed preview trigger for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
