name: 🧩 US · ⚡ PR Checkbox Executor

on:
  issue_comment:
    types: [edited]

run-name: "⚡ Ação via Checkbox • PR #${{ github.event.issue.number }} por @${{ github.actor }}"

env:
  # Estratégia de resolução de conflito no fallback de rebase:
  # "ours"   -> Prioriza o código da branch base (ex: main)
  # "theirs" -> Prioriza os commits da branch do PR
  # ""       -> Falha o step se houver conflito
  CONFLICT_STRATEGY: "ours"

permissions:
  contents: write
  pull-requests: write

jobs:
  handle-checkbox:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- pr-interactive-actions -->') &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Gerar Token do GitHub App
        id: app-token
        uses: rodkisten/github/app-token@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write

      - name: 🤖 Obter Identidade do GitHub App
        id: bot-identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: app } = await github.rest.apps.getAuthenticated();
            const { data: botUser } = await github.rest.users.getByUsername({
              username: `${app.slug}[bot]`
            });

            core.setOutput('name', `${app.slug}[bot]`);
            core.setOutput('email', `${botUser.id}+${app.slug}[bot]@users.noreply.github.com`);

      - name: 🔍 Identificar Checkboxes Marcados e Branch do PR
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const body = context.payload.comment.body;
            const runSync = body.includes('- [x] 🔄 **Sincronizar Branch**');
            const runPrettier = body.includes('- [x] 🎨 **Rodar Prettier**');
            const runLockfile = body.includes('- [x] 📦 **Atualizar Lockfile**');

            if (!runSync && !runPrettier && !runLockfile) {
              core.info('Nenhum checkbox válido foi marcado.');
              core.setOutput('should_run', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput('should_run', 'true');
            core.setOutput('sync', runSync);
            core.setOutput('prettier', runPrettier);
            core.setOutput('lockfile', runLockfile);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('base_branch', pr.base.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: 📥 Checkout da Branch do PR
        if: steps.parse.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse.outputs.head_repo }}
          ref: ${{ steps.parse.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🔄 Sincronizar Branch do PR com a Base
        id: sync-branch
        if: steps.parse.outputs.sync == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_BRANCH: ${{ steps.parse.outputs.branch }}
          BASE_BRANCH: ${{ steps.parse.outputs.base_branch }}
          BOT_NAME: ${{ steps.bot-identity.outputs.name }}
          BOT_EMAIL: ${{ steps.bot-identity.outputs.email }}
        run: |
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"

          # 1. Tenta atualizar nativamente via API do GitHub (commit de merge assinado pelo App)
          if gh api --method PUT "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/update-branch" --silent; then
            echo "✅ Branch atualizada diretamente via GitHub API por ${BOT_NAME}."
            git pull origin "${HEAD_BRANCH}"
            echo "sync_method=merge" >> $GITHUB_OUTPUT
          else
            # 2. Fallback: se houver conflito na API, executa o rebase local com a estratégia da variável
            echo "⚠️ Atualização direta falhou. Iniciando fallback com rebase..."
            
            git remote add upstream "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" 2>/dev/null || true
            git fetch upstream "${BASE_BRANCH}"

            REBASE_ARGS=""
            if [ -n "$CONFLICT_STRATEGY" ]; then
              REBASE_ARGS="-X $CONFLICT_STRATEGY"
            fi

            git rebase $REBASE_ARGS "upstream/${BASE_BRANCH}"
            git push --force-with-lease origin "${HEAD_BRANCH}"
            echo "✅ Rebase concluído por ${BOT_NAME} com estratégia '${CONFLICT_STRATEGY:-padrão}'."
            echo "sync_method=rebase" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Atualizar Comentário com Resultado do Sync
        if: steps.parse.outputs.sync == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const method = '${{ steps.sync-branch.outputs.sync_method }}';
            const baseBranch = '${{ steps.parse.outputs.base_branch }}';
            const strategy = '${{ env.CONFLICT_STRATEGY }}' || 'padrão';

            let syncReport = `### 🔄 Sincronização de Branch\n\n`;
            syncReport += `> [!TIP]\n`;

            if (method === 'merge') {
              syncReport += `> ✅ Branch atualizada com \`${baseBranch}\` via **Merge direto** (sem conflitos).\n`;
            } else {
              syncReport += `> ✅ Conflitos detectados no merge direto. Branch sincronizada com \`${baseBranch}\` via **Rebase** (estratégia: \`${strategy}\`).\n`;
            }

            await core.summary.addRaw(syncReport).write();

            const startMarker = '<!-- sync-report-start -->';
            const endMarker = '<!-- sync-report-end -->';
            const wrappedReport = `\n\n${startMarker}\n---\n${syncReport}\n${endMarker}`;

            // Desmarca o checkbox do Sync e anexa/atualiza o relatório
            let currentBody = context.payload.comment.body.replace(
              '- [x] 🔄 **Sincronizar Branch**',
              '- [ ] 🔄 **Sincronizar Branch**'
            );

            const markerRegex = new RegExp(`\\s*${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            if (markerRegex.test(currentBody)) {
              currentBody = currentBody.replace(markerRegex, wrappedReport);
            } else {
              currentBody += wrappedReport;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: currentBody,
            });

      - name: 🟢 Setup Node.js
        if: steps.parse.outputs.prettier == 'true' || steps.parse.outputs.lockfile == 'true'
        uses: rodkisten/github/setup-node@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          node-version: "20"
          install: "false"
          cache: "false"

      - name: 🎨 Executar Prettier
        if: steps.parse.outputs.prettier == 'true'
        shell: bash
        run: |
          npm install
          set +e
          npx prettier --write . --ignore-unknown 2> prettier-errors.log
          EXIT_CODE=$?
          set -e
          echo "Prettier finalizou com código: $EXIT_CODE"

      - name: 📊 Gerar Resumo e Atualizar Comentário no PR
        if: steps.parse.outputs.prettier == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const { data: latestComment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
            });

            const rawLog = fs.existsSync('prettier-errors.log')
              ? fs.readFileSync('prettier-errors.log', 'utf8')
              : '';

            const cleanLog = rawLog.replace(/\x1B\[[0-9;]*[a-zA-Z]/g, '');

            const errorBlocks = cleanLog
              .split(/(?=\[error\] )/g)
              .filter((block) => block.startsWith('[error] '));

            const getLang = (file) => {
              const ext = path.extname(file).replace('.', '').toLowerCase();
              const map = {
                js: 'javascript', mjs: 'javascript', cjs: 'javascript',
                ts: 'typescript', mts: 'typescript', cts: 'typescript',
                jsx: 'jsx', tsx: 'tsx',
                json: 'json', jsonc: 'jsonc',
                html: 'html', vue: 'html', svelte: 'html',
                css: 'css', scss: 'scss', less: 'less',
                md: 'markdown', mdx: 'markdown',
                yml: 'yaml', yaml: 'yaml',
                graphql: 'graphql', gql: 'graphql'
              };
              return map[ext] || 'text';
            };

            let reportMd = '';

            if (errorBlocks.length === 0) {
              reportMd += `### ✨ Prettier\n\n`;
              reportMd += `> [!TIP]\n`;
              reportMd += `> ✅ Todos os arquivos foram formatados sem nenhum erro de sintaxe!\n`;
            } else {
              reportMd += `### 🎨 Relatório de Formatação (Prettier)\n\n`;
              reportMd += `> [!WARNING]\n`;
              reportMd += `> **${errorBlocks.length} arquivo(s)** não puderam ser formatados devido a erros de sintaxe, mas todos os outros arquivos válidos foram formatados normalmente.\n\n`;

              reportMd += `#### 📋 Resumo dos Arquivos Ignorados\n\n`;
              reportMd += `| # | Arquivo | Motivo Principal |\n`;
              reportMd += `| :- | :--- | :--- |\n`;

              const detailsList = [];

              errorBlocks.forEach((block, index) => {
                const lines = block.trim().split('\n');
                const firstLineMatch = lines[0].match(/^\[error\]\s+([^:]+):\s*(.*)$/);
                const filePath = firstLineMatch ? firstLineMatch[1] : `Arquivo #${index + 1}`;
                const shortError = firstLineMatch ? firstLineMatch[2].replace(/\|/g, '\\|') : 'Erro de sintaxe';
                const lang = getLang(filePath);

                reportMd += `| ${index + 1} | \`${filePath}\` | ${shortError} |\n`;

                detailsList.push(
                  `<details>\n<summary>🔴 <code>${filePath}</code> — Clique para ver o erro completo</summary>\n\n\`\`\`${lang}\n${block.trim()}\n\`\`\`\n</details>\n`
                );
              });

              reportMd += `\n#### 🔍 Detalhes dos Erros\n\n` + detailsList.join('\n');
            }

            await core.summary.addRaw(reportMd).write();

            const startMarker = '<!-- prettier-report-start -->';
            const endMarker = '<!-- prettier-report-end -->';
            const wrappedReport = `\n\n${startMarker}\n---\n${reportMd}\n${endMarker}`;

            // Desmarca o checkbox do Prettier e anexa/atualiza o relatório
            let currentBody = latestComment.body.replace(
              '- [x] 🎨 **Rodar Prettier**',
              '- [ ] 🎨 **Rodar Prettier**'
            );

            const markerRegex = new RegExp(`\\s*${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            if (markerRegex.test(currentBody)) {
              currentBody = currentBody.replace(markerRegex, wrappedReport);
            } else {
              currentBody += wrappedReport;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: currentBody,
            });
