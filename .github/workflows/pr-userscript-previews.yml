name: 📸 PR Userscript Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.yml'
run-name: "📸 Preview Deploy • PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🔑 Gerar Token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📦 Build numbered PR installers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAGES_PROJECT: ${{ vars.USERSCRIPTS_PREVIEW_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [[ -z "$PAGES_PROJECT" ]]; then
            echo "::error::Configure USERSCRIPTS_PREVIEW_PAGES_PROJECT"
            exit 1
          fi
          export USERSCRIPTS_PREVIEW_URL="https://pr-$PR_NUMBER.$PAGES_PROJECT.pages.dev"
          export USERSCRIPTS_PREVIEW_ROOT=true
          npm ci --legacy-peer-deps --no-audit --no-fund
          node build/pr-preview-scope.mjs | tee /tmp/preview-scope.json
          TARGETS="$(node -e 'const s=require("/tmp/preview-scope.json"); process.stdout.write(s.targets.join(","))')"
          if [[ -z "$TARGETS" ]]; then
            echo "No executable changes; preview catalog is unchanged."
            echo "SKIP_PREVIEW=true" >> "$GITHUB_ENV"
            exit 0
          fi
          node build/build.mjs "--targets=$TARGETS"
          node build/pr-preview.mjs
          # Fail explicitly if a declared userscript is absent from this PR build.
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const dir = `dist/pr-preview/${process.env.PR_NUMBER}`;
          const manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, "utf8"));
          if (fs.existsSync("src/userscripts/inspektor/index.ts")) {
            const entry = manifest.scripts.find((script) => script.id === "inspektor");
            if (!entry) throw Error("Inspektor missing from PR preview manifest");
            for (const file of [entry.file, entry.metaFile]) {
              if (!fs.existsSync(`${dir}/${file}`)) throw Error("Inspektor preview missing: " + file);
            }
            console.log("Verified Inspektor installer in PR #" + process.env.PR_NUMBER);
          }
          NODE
          echo "### Preview build scope" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/preview-scope.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: ☁️ Deploy isolated Cloudflare Pages preview
        if: env.SKIP_PREVIEW != 'true'
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.USERSCRIPTS_PREVIEW_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$PAGES_PROJECT" ]]; then
            echo "::error::Configure Cloudflare secrets and USERSCRIPTS_PREVIEW_PAGES_PROJECT."
            exit 1
          fi
          npm exec --yes --package=wrangler@4 -- wrangler pages deploy "dist/pr-preview/$PR_NUMBER" --project-name "$PAGES_PROJECT" --branch "pr-$PR_NUMBER" 2>&1 | tee /tmp/preview-deploy.log
          preview_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+[.]pages[.]dev' /tmp/preview-deploy.log | tail -1)"
          if [[ -z "$preview_url" ]]; then
            echo "::error::Cloudflare did not return a deployment URL"
            exit 1
          fi
          alias_url="https://pr-$PR_NUMBER.$PAGES_PROJECT.pages.dev"
          echo "url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "Published: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 Verify published URL before commenting
        if: env.SKIP_PREVIEW != 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --location --max-time 15 "$PREVIEW_URL/" -o /tmp/preview-index.html && grep -q 'Userscripts Preview' /tmp/preview-index.html; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview deployment is not reachable"
          exit 1

      - name: 🔍 Coletar Diff e Metadados do Commit
        if: env.SKIP_PREVIEW != 'true'
        id: diff-info
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/github-actions.mjs collect

      - name: 💬 Publicar ou Atualizar Comentário de Preview
        if: env.SKIP_PREVIEW != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          SHORT_SHA: ${{ steps.diff-info.outputs.short_sha }}
          COMMIT_URL: ${{ steps.diff-info.outputs.commit_url }}
          DIFF_ENTRY: ${{ steps.diff-info.outputs.diff_entry }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: node scripts/github-actions.mjs publish
