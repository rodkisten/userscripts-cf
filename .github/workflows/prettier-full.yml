name: ✨ Prettier · Format All Files

run-name: >-
  ✨ Prettier · ${{ inputs.target_branch || github.ref_name }} ·
  ${{ inputs.create_pr && '🔀 Create PR' || '🚀 Push Changes' }}

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 🌿 Branch to format (defaults to the selected workflow branch)
        required: false
        type: string
      create_pr:
        description: 🔀 Open a pull request instead of pushing to the target branch
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prettier-full-${{ inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  prettier:
    name: 🎨 Format Repository
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Authenticate GitHub App
        id: app-token
        uses: rodkisten/github/app-token@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          app-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 📥 Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Setup and install dependencies
        uses: rodkisten/github/execute@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          node-version: '22'
          package-manager: npm
          install-args: --legacy-peer-deps
          script: ':'

      - name: 🎨 Format and lint with Rod Actions
        id: format
        uses: rodkisten/github/format@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          mode: fix
          scope: all
          lint: 'true'
          results-file: ${{ runner.temp }}/rod-format-results.json

      - name: 🛡️ Protect Workflow Files From Bot Commits
        shell: bash
        run: |
          if [[ -d .github/workflows ]]; then
            git restore --worktree -- .github/workflows
          fi

      - name: 🔍 Detect Modified Files
        id: changes
        shell: bash
        run: |
          git status --porcelain > "$RUNNER_TEMP/changed_files.txt"
          CHANGED_COUNT=$(wc -l < "$RUNNER_TEMP/changed_files.txt" | tr -d ' ')
          echo "count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"

          if [[ "$CHANGED_COUNT" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/changed_files.txt"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No formatting changes detected."
          fi

      - name: 🔎 Verify Eligible Files Formatting
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          # Executa check sem travar o pipeline caso existam arquivos com sintaxe inválida
          npx prettier --check . --ignore-unknown || echo "::warning::Some files could not be verified due to syntax errors."

      - name: 🔀 Create Formatting Pull Request
        id: create-pr
        if: steps.changes.outputs.changed == 'true' && inputs.create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/prettier-${{ inputs.target_branch || github.ref_name }}
          delete-branch: true
          commit-message: "style: ✨ format repository with Prettier"
          title: "style: ✨ format repository with Prettier"
          body: |
            ### ✨ Automated Prettier Formatting

            - **Target Branch:** `${{ inputs.target_branch || github.ref_name }}`
            - **Modified Files:** `${{ steps.changes.outputs.count }}`
            - **Formatter errors (see action report):** `0`
          base: ${{ inputs.target_branch || github.ref_name }}
          labels: automated

      - name: 🚀 Commit Directly to Selected Branch
        id: direct-push
        if: steps.changes.outputs.changed == 'true' && !inputs.create_pr
        shell: bash
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: ✨ format repository with Prettier"

          target="${{ inputs.target_branch || github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target"
            if ! git rebase "origin/$target"; then
              git rebase --abort || true
              echo "::error::❌ Formatting conflicts with concurrent changes. Re-run formatting after resolving them."
              exit 1
            fi
            if git push origin "HEAD:$target"; then
              SHA=$(git rev-parse HEAD)
              echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
              echo "✅ Formatting published to $target (attempt $attempt)."
              exit 0
            fi
            echo "::warning::⚠️ Remote branch advanced during push; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "::error::❌ Remote branch continued advancing; formatting push abandoned without force."
          exit 1

      - name: 📊 Generate Rich Summary & PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');

            const targetBranch = '${{ inputs.target_branch || github.ref_name }}';
            const createPr = '${{ inputs.create_pr }}' === 'true';
            const hasChanges = '${{ steps.changes.outputs.changed }}' === 'true';
            const changedCount = parseInt('${{ steps.changes.outputs.count || 0 }}', 10);
            const errorCount = parseInt('0', 10);
            const prNumber = '${{ steps.create-pr.outputs.pull-request-number }}';
            const prUrl = '${{ steps.create-pr.outputs.pull-request-url }}';
            const commitSha = '${{ steps.direct-push.outputs.commit_sha }}';

            const readLines = (file) => {
              if (!fs.existsSync(file)) return [];
              return fs.readFileSync(file, 'utf8')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean);
            };

            const modifiedFiles = readLines(require('path').join(process.env.RUNNER_TEMP, 'changed_files.txt')).map(line => {
              const status = line.slice(0, 2).trim();
              const path = line.slice(3).trim();
              return { status, path };
            });

            const errorLines = readLines('prettier_errors.log');

            // 1. Construção do Job Summary (@actions/core)
            await core.summary
              .addHeading('✨ Prettier Formatting Report', 2)
              .addTable([
                [
                  { data: 'Property', header: true },
                  { data: 'Value', header: true }
                ],
                ['🌿 **Target Branch**', `\`${targetBranch}\``],
                ['⚙️ **Delivery Mode**', createPr ? '🔀 Pull Request' : '🚀 Direct Push'],
                ['📝 **Formatted Files**', `**${changedCount}** file(s)`],
                ['⚠️ **Syntax Errors Skipped**', errorCount > 0 ? `⚠️ **${errorCount}** error(s)` : '✅ **0** errors'],
                [
                  '🔗 **Result**',
                  !hasChanges
                    ? '✨ Already clean — no changes needed'
                    : createPr && prUrl
                      ? `[Pull Request #${prNumber}](${prUrl})`
                      : commitSha
                        ? `Commit [\`${commitSha.slice(0, 7)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${commitSha})`
                        : '❌ Failed to publish'
                ]
              ]);

            if (modifiedFiles.length > 0) {
              const previewFiles = modifiedFiles.slice(0, 50);
              const rows = [
                [
                  { data: 'Git Status', header: true },
                  { data: 'File Path', header: true }
                ],
                ...previewFiles.map(f => [`\`${f.status}\``, `\`${f.path}\``])
              ];

              await core.summary
                .addHeading(`📂 Modified Files (${modifiedFiles.length})`, 3)
                .addTable(rows);

              if (modifiedFiles.length > 50) {
                await core.summary.addRaw(
                  `\n> *Showing first 50 of ${modifiedFiles.length} modified files.*\n`
                );
              }
            }

            if (errorLines.length > 0) {
              await core.summary
                .addHeading('⚠️ Prettier Parsing Errors (Skipped)', 3)
                .addQuote('Prettier wrote all valid files and skipped the errors below:')
                .addCodeBlock(errorLines.slice(0, 30).join('\n'), 'text');
            }

            await core.summary.write();

            // 2. Comentário detalhado no Pull Request (se criado)
            if (createPr && prNumber) {
              const fileListPreview = modifiedFiles
                .slice(0, 25)
                .map(f => `- \`${f.path}\``)
                .join('\n');

              const moreFilesNote = modifiedFiles.length > 25
                ? `\n- *...and ${modifiedFiles.length - 25} more file(s)*`
                : '';

              const errorSection = errorLines.length > 0
                ? `\n<details>\n<summary>⚠️ <b>${errorCount} file(s) skipped due to syntax errors</b></summary>\n\n\`\`\`text\n${errorLines.slice(0, 20).join('\n')}\n\`\`\`\n</details>\n`
                : '';

              const commentBody = [
                `## ✨ Prettier Formatting Summary`,
                ``,
                `| Metric | Details |`,
                `| :--- | :--- |`,
                `| 🌿 **Base Branch** | \`${targetBranch}\` |`,
                `| 📝 **Files Formatted** | **${changedCount}** |`,
                `| ⚠️ **Errors Skipped** | **${errorCount}** |`,
                `| 🛡️ **Workflows** | Protected (excluded from commit) |`,
                ``,
                `<details open>`,
                `<summary>📂 <b>Modified Files</b></summary>`,
                ``,
                fileListPreview + moreFilesNote,
                `</details>`,
                errorSection,
                `---`,
                `*🤖 Automated run via [Workflow #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                body: commentBody
              });

              core.info(`💬 Posted summary comment on PR #${prNumber}`);
            }
