name: Prettier · Format all files

run-name: >-
  Prettier · ${{ inputs.target_branch || github.ref_name }} ·
  ${{ inputs.create_pr && 'Create PR' || 'Push changes' }}

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to format (defaults to the selected workflow branch)
        required: false
        type: string
      create_pr:
        description: Open a pull request instead of pushing to the target branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prettier-full-${{ inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  prettier:
    name: Format repository
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Format all supported files
        run: npm run format

      - name: Exclude workflow files from bot formatting commits
        shell: bash
        run: |
          # Keep workflow formatting in a dedicated authorized change.
          # Keep these files unchanged; report them for a separately authorized fix.
          if [[ -d .github/workflows ]]; then
            git restore --worktree -- .github/workflows
          fi
      - name: Show changes
        id: changes
        shell: bash
        run: |
          git status --short
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify formatting of commit-eligible files
        shell: bash
        run: |
          printf '%s\n' '.github/workflows/**' > .prettierignore
          npx prettier --check .
          rm -f .prettierignore

      - name: Create formatting pull request
        if: steps.changes.outputs.changed == 'true' && inputs.create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/prettier-${{ inputs.target_branch || github.ref_name }}
          delete-branch: true
          commit-message: "style: format repository with Prettier"
          title: "style: format repository with Prettier"
          body: |
            Automated full-repository Prettier formatting.

            Triggered from: ${{ inputs.target_branch || github.ref_name }}
            Command: `npm run format`
          base: ${{ inputs.target_branch || github.ref_name }}
          labels: automated

      - name: Commit directly to selected branch
        if: steps.changes.outputs.changed == 'true' && !inputs.create_pr
        shell: bash
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format repository with Prettier"
          # Other agents and PR checks may update the branch while formatting runs.
          # Rebase the formatting-only commit onto the newest remote head.
          # Never force-push or silently overwrite concurrent changes.
          target="${{ inputs.target_branch || github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target"
            if ! git rebase "origin/$target"; then
              git rebase --abort || true
              echo "::error::Formatting conflicts with concurrent changes. Re-run formatting after resolving them."
              exit 1
            fi
            if git push origin "HEAD:$target"; then
              echo "Formatting published to $target (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Remote branch advanced during push; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "::error::Remote branch continued advancing; formatting push abandoned without force."
          exit 1

      - name: No formatting changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "All files are already formatted."
