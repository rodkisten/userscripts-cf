name: ⚛️ React foundation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/core/runtime-react.tsx"
      - "src/core/runtime-context-react.tsx"
      - "src/core/runtime-mount-react.tsx"
      - "src/core/react-context-contract.ts"
      - "tsconfig.react-context.json"
      - "tests/react-runtime-context.test.ts"
      - "tests/runtime-react-root-audit.test.js"
      - "build/react-root-audit.mjs"
      - "build/check-react-root-ownership.mjs"
      - "build/bundle-runtime.mjs"
      - "build/build.mjs"
      - "tsconfig.react.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/react-foundation.yml"
  pull_request:
    paths:
      - "src/core/runtime-react.tsx"
      - "src/core/runtime-context-react.tsx"
      - "src/core/runtime-mount-react.tsx"
      - "src/core/react-context-contract.ts"
      - "tsconfig.react-context.json"
      - "tests/react-runtime-context.test.ts"
      - "tests/runtime-react-root-audit.test.js"
      - "build/react-root-audit.mjs"
      - "build/check-react-root-ownership.mjs"
      - "build/bundle-runtime.mjs"
      - "build/build.mjs"
      - "tsconfig.react.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/react-foundation.yml"

permissions:
  contents: read

concurrency:
  group: react-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: React 19 runtime TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check React root ownership
        run: npm run check:react-roots
      - name: Test React root audit utility
        run: npx vitest run tests/runtime-react-root-audit.test.js
      - name: Check isolated React provider types
        run: npx tsc --noEmit -p tsconfig.react-context.json
      - name: Test React context ownership
        run: npx vitest run tests/react-runtime-context.test.ts
      - name: Check full React runtime integration
        run: npm run typecheck:react
