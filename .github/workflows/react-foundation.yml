name: ⚛️ React foundation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/core/runtime-react.ts"
      - "src/core/runtime-context-react.tsx"
      - "tsconfig.react.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/react-foundation.yml"
  pull_request:
    paths:
      - "src/core/runtime-react.ts"
      - "src/core/runtime-context-react.tsx"
      - "tsconfig.react.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/react-foundation.yml"

permissions:
  contents: read

concurrency:
  group: react-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: React 19 runtime TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check React runtime and context types
        run: npm run typecheck:react
