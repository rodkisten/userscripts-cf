name: 🧪 Testes Relacionados & Grafo de Impacto

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.{mjs,mts,js,ts}"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "🔖 Branch ou commit base para comparar (ex: main, HEAD~1)"
        required: true
        default: "main"
        type: string
      run_tests:
        description: "▶️ Executar os testes encontrados?"
        required: true
        default: true
        type: boolean

jobs:
  analyze-and-test:
    name: 🔍 Analisar Impacto e Rodar Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Detectar gerenciador de pacotes
        id: pm
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "exec=pnpm exec" >> $GITHUB_OUTPUT
            echo "📦 Gerenciador detectado: pnpm"
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "exec=npx" >> $GITHUB_OUTPUT
            echo "📦 Gerenciador detectado: npm"
          fi

      - name: 📦 Setup pnpm (se aplicável)
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js com cache dinâmico
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.pm.outputs.manager }}

      - name: 💿 Instalar dependências
        run: |
          if [ "${{ steps.pm.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: 🗺️ Mapear arquivos alterados e gerar grafo Mermaid
        id: map_changes
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: node scripts/map-related-tests.mjs

      - name: ⚡ Rodar testes relacionados no Vitest
        if: ${{ (github.event_name == 'push' || inputs.run_tests) && steps.map_changes.outputs.has_files == 'true' }}
        env:
          CHANGED_FILES: ${{ steps.map_changes.outputs.changed_files }}
          EXEC_CMD: ${{ steps.pm.outputs.exec }}
        run: |
          echo "🧪 Executando Vitest via $EXEC_CMD..."
          $EXEC_CMD vitest related $CHANGED_FILES --run --passWithNoTests

      - name: 🟩 Rodar testes relacionados no Node Test Runner
        if: ${{ (github.event_name == 'push' || inputs.run_tests) && steps.map_changes.outputs.node_tests != '' }}
        env:
          NODE_TESTS: ${{ steps.map_changes.outputs.node_tests }}
        run: |
          echo "🧪 Executando node --test..."
          node --test $NODE_TESTS
