name: Release userscripts
run-name: "Release · ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }} · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento semântico da versão"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Only one release can bump and publish at a time. Do not cancel a release midway.
concurrency:
  group: userscripts-releases
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Select next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          # Resume a release after a failed upload without incrementing twice.
          LAST_SUBJECT="$(git log -1 --format=%s)"
          CURRENT="$(node -p 'require("./package.json").version')"
          RELEASE_STATE="$(gh release view "v$CURRENT" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          if [[ "$LAST_SUBJECT" == "chore(release): v$CURRENT [skip ci]" && "$RELEASE_STATE" != "false" ]]; then
            VERSION="$CURRENT"
            echo "resume=true" >> "$GITHUB_OUTPUT"
          else
            npm version "$BUMP" --no-git-tag-version --ignore-scripts
            VERSION="$(node -p 'require("./package.json").version')"
            echo "resume=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Next userscripts release: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck, build and test before publishing
        run: npm test
      - name: Verify standalone userscript metadata
        run: node --test tests/standalone-minify.test.js
      # Formatting is handled separately and must not block publishing.
      - name: Commit version to main
        if: steps.version.outputs.resume != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main
      - name: Prepare Cloudflare Worker with versioned assets
        run: node build/hosting.mjs
      - name: Deploy versioned userscripts to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN in repository Actions secrets"
            exit 1
          fi
          npm run deploy:cloudflare
      - name: Publish GitHub Release with userscripts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm run release
      - name: Release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Cloudflare Worker userscripts-cf deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
