name: Release userscripts
run-name: "Release · ${{ inputs.tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag igual à versão do package.json (ex.: v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: userscripts-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Publish installable scripts and metadata
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
