name: 🧩 US · 🚀 Release Userscripts

run-name: "🚀 Release · ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }} · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "🏷️ Incremento semântico da versão"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      skip_tests:
        description: "⚡ Ignorar testes e typecheck no deploy manual (build continua obrigatório)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# Serialize release attempts so queued runs can recover after a failed publication.
concurrency:
  group: userscripts-releases-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || 'main' }}
  # A later formatting/merge commit must not cancel a deploy-triggered release.
  cancel-in-progress: false

jobs:
  detect:
    name: 🔎 Check for unreleased deploys
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(fromJSON('["dependabot[bot]","renovate[bot]","renovate","dependabot"]'), github.actor)
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.source.outputs.skip == 'false' }}
      released_version: ${{ steps.source.outputs.released_version }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 🔎 Detect Unreleased Deploy Commit
        id: source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [[ -z "$latest_tag" ]]; then
            commit_range="HEAD"
            echo "released_version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            commit_range="$latest_tag..HEAD"
            echo "released_version=${latest_tag#v}" >> "$GITHUB_OUTPUT"
          fi

          if git log "$commit_range" --format=%B | grep -Fq '[deploy]'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🚀 Found an unreleased [deploy] commit after ${latest_tag:-the beginning of history}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ No unreleased [deploy] commit after ${latest_tag:-the beginning of history}; release skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: 📦 Build, Deploy & Publish
    needs: detect
    environment: production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.detect.outputs.should_release == 'true') &&
      !contains(fromJSON('["dependabot[bot]","renovate[bot]","renovate","dependabot"]'), github.actor)
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Authenticate GitHub App
        id: app-token
        uses: rodkisten/github/app-token@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          app-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: rodkisten/github/setup-node@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          node-version: "24"
          install: "false"

      # The release workflow can recover from package.json updates merged without
      # a matching lockfile. The version commit below persists the repaired lock.
      - name: 🔄 Synchronize Lockfile Before Clean Install
        id: lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          if ! git diff --quiet -- package-lock.json; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "::notice::package-lock.json was out of sync; it will be included in the release version commit."
            git diff --stat -- package-lock.json
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Install Locked Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧩 Calculate AST Version Plan
        id: version-plan
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            node build/version-plan.mjs --from="${BASE_SHA}"
          else
            node build/version-plan.mjs --files=""
          fi
          node build/apply-version-plan.mjs version-plan.json
          affected="$(node -e 'const p=require("./version-plan.json"); process.stdout.write((p.affected||[]).join(","))')"
          echo "affected=${affected}" >> "$GITHUB_OUTPUT"
          if [[ -n "$affected" ]]; then
            echo "🧩 Affected userscripts: ${affected}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ No userscript source dependency changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🏷️ Select Next Version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Resume a version already committed by a release that failed before tagging.
          LAST_SUBJECT="$(git log -1 --format=%s)"
          CURRENT="$(node -p 'require("./package.json").version')"
          RELEASED="${{ needs.detect.outputs.released_version }}"
          RELEASE_STATE="$(gh release view "v$CURRENT" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          RESUME=false
          if [[ "$RELEASE_STATE" != "false" ]] && {
            [[ "$LAST_SUBJECT" == "chore(release): v$CURRENT [skip ci]" ]] ||
            [[ "$EVENT_NAME" == "push" && "$CURRENT" != "$RELEASED" ]]
          }; then
            RESUME=true
          fi

          if [[ "$RESUME" == "true" ]]; then
            VERSION="$CURRENT"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "♻️ Resuming incomplete release v$VERSION"
          else
            npm version "$BUMP" --no-git-tag-version --ignore-scripts
            VERSION="$(node -p 'require("./package.json").version')"
            echo "resume=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Bumped version to v$VERSION ($BUMP)"
          fi
          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🧪 Typecheck, Build & Test
        if: steps.source.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
        uses: rodkisten/github/console-run@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          command: npm test

      - name: 🏗️ Build Userscripts (Tests & Typecheck Non-Blocking)
        id: manual-build
        if: github.event_name == 'workflow_dispatch' && inputs.skip_tests
        run: |
          set -euo pipefail
          if npm run --if-present typecheck; then
            echo "typecheck_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "typecheck_status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::⚠️ Typecheck errors detected, proceeding because skip_tests=true."
          fi

          if ! npm run build; then
            echo "::warning::⚠️ Default build script failed (possibly due to typecheck). Falling back to bundler-only build..."
            if npm run --if-present build:scripts || npm run --if-present bundle; then
              echo "build_fallback=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::❌ Bundle build failed."
              exit 1
            fi
          else
            echo "build_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔍 Verify Installable Userscript Metadata
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const manifest=JSON.parse(fs.readFileSync("dist/manifest.json","utf8")); if(!manifest.scripts.length) throw Error("No scripts built"); for(const script of manifest.scripts) {const source=fs.readFileSync(`dist/${script.file}`,"utf8"); if(!source.startsWith("// ==UserScript==")) throw Error(`Missing metadata: ${script.file}`)}'

      # Formatting is handled separately and must not block publishing.
      - name: 🛡️ Guard Against Superseded Automatic Release
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::error::❌ Outdated workflow: current main is $latest, run started at $GITHUB_SHA"
            exit 1
          fi

      - name: 📝 Commit & Push Version to Main
        id: version-commit
        if: steps.version.outputs.resume != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add package.json package-lock.json userscripts.versions.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Prepare Cloudflare Worker Assets
        run: node build/hosting.mjs

      - name: 🛡️ Guard Against Outdated Release Before Cloudflare Deploy
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          local_head="$(git rev-parse HEAD)"
          if [[ "$latest" != "$local_head" ]]; then
            echo "::error::❌ Main moved after this release started: $latest (built from $local_head)"
            exit 1
          fi

      - name: ☁️ Deploy Versioned Userscripts to Cloudflare
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USERSCRIPTS_BASE_URL: https://userscripts.migos.club
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::❌ Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment secrets"
            exit 1
          fi
          npm run deploy:cloudflare

      - name: 🎉 Publish GitHub Release & Checksums
        id: gh-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm run release

      - name: 🧩 Publish Independent Userscript Releases
        if: steps.version-plan.outputs.affected != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node build/release-individual.mjs

      - name: 📊 Generate Rich Release Summary
        if: always()
        uses: actions/github-script@v7
        env:
          SKIPPED: "false"
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_RESUME: ${{ steps.version.outputs.resume }}
          BUMP_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || 'false' }}
          TYPECHECK_STATUS: ${{ steps.manual-build.outputs.typecheck_status }}
          LOCK_SYNCED: ${{ steps.lockfile.outputs.synced }}
          COMMIT_SHA: ${{ steps.version-commit.outputs.commit_sha }}
        with:
          script: |
            const fs = require('fs');

            const skipped = process.env.SKIPPED === 'true';
            const jobStatus = process.env.JOB_STATUS;
            const version = process.env.VERSION || '';
            const previousVersion = process.env.PREVIOUS_VERSION || '';
            const tag = process.env.TAG || '';
            const isResume = process.env.IS_RESUME === 'true';
            const bumpType = process.env.BUMP_TYPE || 'patch';
            const skipTests = process.env.SKIP_TESTS === 'true';
            const typecheckStatus = process.env.TYPECHECK_STATUS || '';
            const lockSynced = process.env.LOCK_SYNCED === 'true';
            const commitSha = process.env.COMMIT_SHA || process.env.GITHUB_SHA || '';
            const baseUrl = 'https://userscripts.migos.club';
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;

            if (skipped) {
              await core.summary
                .addHeading('🤖 Release Skipped (Dependency Bot)', 2)
                .addQuote('Commits authored by Renovate or Dependabot do not trigger production releases.')
                .write();
              return;
            }

            const statusBadge = jobStatus === 'success'
              ? '✅ **Published & Deployed**'
              : jobStatus === 'cancelled'
                ? '🚫 **Cancelled (Superseded)**'
                : '❌ **Failed**';

            let qaStatusText = '✅ Executed (`npm test` + typecheck)';
            if (skipTests) {
              qaStatusText = typecheckStatus === 'failed'
                ? '⚡ Skipped tests (⚠️ typecheck warnings ignored)'
                : '⚡ Skipped tests (✅ typecheck passed)';
            }

            await core.summary
              .addHeading(`🚀 Userscripts Release ${tag ? `· ${tag}` : ''}`, 2)
              .addTable([
                [
                  { data: 'Property', header: true },
                  { data: 'Details', header: true }
                ],
                ['📡 **Status**', statusBadge],
                [
                  '🏷️ **Version**',
                  version
                    ? isResume
                      ? `\`${tag}\` *(resumed draft)*`
                      : `\`v${previousVersion}\` → **\`${tag}\`** (\`${bumpType}\`)`
                    : '—'
                ],
                ['🎯 **Trigger**', `\`${context.eventName}\` by **@${context.actor}**`],
                ['🧪 **Tests & Typecheck**', qaStatusText],
                ['🔄 **Lockfile**', lockSynced ? '🔧 Auto-repaired & committed' : '✅ In sync'],
                [
                  '🔗 **Version Commit**',
                  commitSha ? `[\`${commitSha.slice(0, 7)}\`](${repoUrl}/commit/${commitSha})` : '—'
                ],
                [
                  '☁️ **Cloudflare Worker**',
                  jobStatus === 'success' ? `[${baseUrl}](${baseUrl})` : '⚠️ Not deployed'
                ],
                [
                  '🎉 **GitHub Release**',
                  jobStatus === 'success' && tag
                    ? `[Release ${tag}](${repoUrl}/releases/tag/${tag})`
                    : '⚠️ Not published'
                ]
              ]);

            if (fs.existsSync('dist/manifest.json')) {
              try {
                const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
                const scripts = Array.isArray(manifest.scripts) ? manifest.scripts : [];

                if (scripts.length > 0) {
                  const scriptRows = [
                    [
                      { data: 'Userscript', header: true },
                      { data: 'File', header: true },
                      { data: 'Version', header: true },
                      { data: 'Direct Install URL', header: true }
                    ],
                    ...scripts.map(s => {
                      const displayName = s.name || s.id || s.file;
                      const scriptVer = s.version ? `\`v${s.version}\`` : `\`${tag}\``;
                      const installUrl = `${baseUrl}/${s.file}`;
                      return [
                        `**${displayName}**`,
                        `\`${s.file}\``,
                        scriptVer,
                        `[Install](${installUrl})`
                      ];
                    })
                  ];

                  await core.summary
                    .addHeading(`📜 Published Userscripts (${scripts.length})`, 3)
                    .addTable(scriptRows);
                }
              } catch (err) {
                core.warning(`Could not parse dist/manifest.json for summary: ${err.message}`);
              }
            }

            await core.summary.write();
