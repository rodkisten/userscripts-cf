name: 🔒 Repair npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Regenerate and verify package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Verify branch and synchronize
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Validate clean installation
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Commit regenerated lockfile
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): regenerate npm lockfile"
          git push origin "HEAD:$BRANCH"
          echo "Regenerated package-lock.json and pushed to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
