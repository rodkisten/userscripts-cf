name: 🔒 Repair npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - feat/shared-event-bridge
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/feat/shared-event-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean installation
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile [skip ci]"
          git push origin HEAD:feat/shared-event-bridge
