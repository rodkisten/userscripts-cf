name: 🔒 Repair npm lockfile

on:
  workflow_dispatch:
    inputs:
      selected_branch:
        description: 'Branch to repair'
        required: false
        default: 'main'
        type: string
    
permissions:
  contents: write

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Regenerate and verify package-lock.json
    outputs:
      changed: ${{ steps.generated_output.outputs.changed }}
      branch: ${{ steps.generated_output.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
     
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.selected_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
     
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify branch and synchronize
        shell: bash
        env:
          BRANCH: ${{ inputs.selected_branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
     
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      
      - name: Validate clean installation
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      - name: Commit regenerated lockfile
        id: generated_output
        shell: bash
        env:
          BRANCH: ${{ inputs.selected_branch || github.ref_name }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): regenerate npm lockfile"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Regenerated package-lock.json and pushed to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
