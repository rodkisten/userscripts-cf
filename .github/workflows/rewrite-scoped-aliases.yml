name: Rewrite scoped aliases
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to rewrite (never main)
        required: true
        default: feat/scoped-userscript-aliases
permissions:
  contents: write
jobs:
  rewrite:
    if: ${{ inputs.target_branch != 'main' && inputs.target_branch != 'master' }}
    runs-on: ubuntu-latest
    concurrency:
      group: scoped-aliases-${{ inputs.target_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rewrite all source imports
        run: node build/scoped-aliases.mjs --write
      - name: Validate syntax and aliases
        run: |
          npm run typecheck
          npm run build
      - name: Commit rewritten files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: migrate scoped aliases [skip ci]'
            git push origin HEAD:${{ inputs.target_branch }}
          fi
