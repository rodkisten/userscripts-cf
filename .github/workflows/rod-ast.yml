name: "🧬 Rod AST · Fixture, diff & typecheck"
on:
  workflow_dispatch:
  push:
    paths:
      - "build/rod-ast.mjs"
      - "build/rod-ast-cli.mjs"
      - "tests/fixtures/rod-ast.input.tsx"
      - ".github/workflows/rod-ast.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: "🧬 Transform fixture"
        run: node build/rod-ast-cli.mjs
      - name: "🔎 Show full diff"
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          diff -u --label fixture/input.tsx tests/fixtures/rod-ast.input.tsx --label fixture/output.tsx artifacts/rod-ast.output.tsx > artifacts/rod-ast.diff || test "$?" -eq 1
          cat artifacts/rod-ast.diff
          echo '## 🧬 Rod AST · Full fixture diff' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`diff' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/rod-ast.diff >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: "🧪 AST unit tests"
        run: node --test tests/rod-ast.test.mjs
      - name: "🧪 Typecheck React"
        run: npm run typecheck:react
      - name: "📦 Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rod-ast-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
