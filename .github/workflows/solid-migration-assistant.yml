name: Solid 2 migration assistant

on:
  workflow_dispatch:
  push:
    branches:
      - feat/shared-event-bridge
    paths:
      - .github/workflows/solid-migration-assistant.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/feat/shared-event-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Solid migration assistant
        env:
          CI: 'true'
        run: |
          timeout 240s npx --yes solid-migration-assistant@latest
      - name: Show migration changes
        if: always()
        run: git status --short
      - name: Commit migration changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "refactor: apply Solid 2 migration assistant"
          git push origin HEAD:feat/shared-event-bridge
