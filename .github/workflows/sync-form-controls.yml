name: "🔀 Sync form-controls with main"
run-name: "🔀 Form controls · sync main · ${{ github.ref_name }}"

on:
  push:
    branches: [feat/form-controls-foundation]
    paths:
      - ".github/workflows/sync-form-controls.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-form-controls-main
  cancel-in-progress: false

jobs:
  sync:
    environment: production
    if: github.ref == 'refs/heads/feat/form-controls-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: feat/form-controls-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: "🔀 Merge latest main, preserving feature work on overlapping lines"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git fetch origin main feat/form-controls-foundation
          git checkout feat/form-controls-foundation
          git reset --hard origin/feat/form-controls-foundation
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Already synchronized with main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -X ours applies only to conflicting hunks; non-conflicting main changes are retained.
          if ! git merge --no-edit -X ours origin/main; then
            echo "Merge requires manual resolution:" >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee -a "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Unexpected uncommitted changes after merge." >&2
            exit 1
          fi
          # Checkout persists Rod GitHub App credentials for this push.
          git push origin HEAD:feat/form-controls-foundation
          echo "Merged main into feature branch at $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
