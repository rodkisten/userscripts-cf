name: "[TEMP] CSS Semantic Migration"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build/css-semantic-audit.mjs"
      - "build/css-semantic-rewrite.mjs"
      - "build/css-style-ownership.mjs"
      - "tests/temp-css-semantic.test.mjs"
      - "tests/temp-css-ownership.test.mjs"
      - ".github/workflows/temp-css-semantic.yml"
permissions:
  contents: read
concurrency:
  group: temp-css-semantic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    name: "[TEMP] CSS utility validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: "[TEMP] Syntax"
        run: |
          node --check build/css-semantic-audit.mjs
          node --check build/css-semantic-rewrite.mjs
          node --check build/css-style-ownership.mjs
      - name: "[TEMP] Isolated codemod and ownership tests"
        run: npx vitest run tests/temp-css-semantic.test.mjs tests/temp-css-ownership.test.mjs
      - name: "[TEMP] CSS import graph"
        run: node build/css-semantic-audit.mjs --write-report
      - name: "[TEMP] CSS ownership report"
        run: node build/css-style-ownership.mjs
      - name: "[TEMP] Upload audits"
        uses: actions/upload-artifact@v4
        with:
          name: temp-css-semantic-audit
          path: artifacts/css-*.json
