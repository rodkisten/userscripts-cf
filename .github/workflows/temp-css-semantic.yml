name: "[TEMP] CSS Semantic Migration"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build/css-semantic-audit.mjs"
      - "build/css-semantic-rewrite.mjs"
      - "build/css-style-ownership.mjs"
      - "build/css-import-graph.mjs"
      - "build/css-semantic-group.mjs"
      - "build/css-semantic-preview.mjs"
      - "migration/css-semantic-groups.json"
      - "tests/temp-css-*.test.mjs"
      - ".github/workflows/temp-css-semantic.yml"
permissions:
  contents: read
concurrency:
  group: temp-css-semantic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    name: "[TEMP] CSS utility validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: "[TEMP] Syntax"
        run: |
          node --check build/css-semantic-audit.mjs
          node --check build/css-semantic-rewrite.mjs
          node --check build/css-style-ownership.mjs
          node --check build/css-import-graph.mjs
          node --check build/css-semantic-group.mjs
          node --check build/css-semantic-preview.mjs
      - name: "[TEMP] Isolated codemod tests"
        run: npx vitest run tests/temp-css-semantic.test.mjs tests/temp-css-ownership.test.mjs tests/temp-css-group.test.mjs tests/temp-css-preview.test.mjs
      - name: "[TEMP] Reports and preview"
        run: |
          node build/css-semantic-audit.mjs --write-report
          node build/css-style-ownership.mjs
          node build/css-semantic-preview.mjs
      - name: "[TEMP] Upload reports"
        uses: actions/upload-artifact@v4
        with:
          name: temp-css-semantic-audit
          path: artifacts/css-*.json
