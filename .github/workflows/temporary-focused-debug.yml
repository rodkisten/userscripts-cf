name: "🧪 Temporary · Focused diagnostics"
on:
  push:
    paths:
      - ".github/workflows/temporary-focused-debug.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build installable fixtures
        run: npm run build
      - name: Focused Vitest diagnostics
        run: npx vitest run tests/rodx-migration.test.js tests/page-repl-boot.test.js --reporter=verbose --maxWorkers=1
