name: "🧪 Validate userscripts"
run-name: "🧪 Userscripts · ${{ github.head_ref || github.ref_name }} · ${{ github.event_name }}"

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "🧪 Typecheck, build & Vitest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: "📦 Install locked dependencies"
        run: npm ci
      - name: "🧪 Run tests"
        run: npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: userscripts-and-loader-lab
          path: |
            dist/
            labs/remote-release/worker.mjs
