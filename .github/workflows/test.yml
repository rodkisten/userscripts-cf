name: Validate userscripts
run-name: "Userscripts · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: userscripts-and-loader-lab
          path: |
            dist/
            labs/remote-release/worker.mjs
