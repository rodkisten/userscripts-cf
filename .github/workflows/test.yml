name: "📚 Design system and lockfile"
run-name: "🧪 Userscripts · ${{ github.head_ref || github.ref_name }} · ${{ github.event_name }}"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # One running validation per PR branch; newer pushes cancel stale runs.
  group: validate-userscripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "📚 Design system and lockfile checks"
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: "🔎 Skip outdated branch commits"
        id: fresh
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          LATEST="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          CURRENT="$(git rev-parse HEAD)"
          if [[ -n "$LATEST" && "$LATEST" == "$CURRENT" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "Superseded by $LATEST; skipping stale validation." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.latest == 'true'
        with:
          node-version: 22
          cache: npm
      - name: "⬆️ Use npm 11 (avoid npm 10 Arborist edgesOut bug)"
        if: steps.fresh.outputs.latest == 'true'
        run: npm install --global npm@11
      - name: "📦 Install locked dependencies"
        if: steps.fresh.outputs.latest == 'true'
        run: npm ci --legacy-peer-deps
    #  - name: "🔐 Enforce GitHub App authentication for commit-capable workflows"
   #     if: steps.fresh.outputs.latest == 'true'
     #   run: node build/check-workflow-bot-auth.mjs
      - name: "📚 Require Design System docs and playground for UI changes"
        if: steps.fresh.outputs.latest == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run check:design-system
      # Validation is read-only: never mutate the PR branch or trigger CI loops.
      # Lockfile repairs belong to the explicitly dispatched repair-lockfile workflow.
      # Tests, builds and artifacts are handled by diagnostics.yml.
      # Do not run npm test here: it duplicates the selective validation workflow.
