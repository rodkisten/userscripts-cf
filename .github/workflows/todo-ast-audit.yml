name: 🗒️ AST Function & Debt Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.tsx"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: AST Audit & PR Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup and install dependencies
        uses: rodkisten/github/execute@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          package-manager: npm
          install: "true"
          script: ":"

      - name: Run AST Function & Diff Audit
        id: ast_audit
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/find-fns.mjs --json --base "origin/$GITHUB_BASE_REF" > ast-audit-report.json

      - name: Publish Step Summary, Annotations & Upsert PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ast-audit-report.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          node --experimental-strip-types scripts/publish-ast-audit.ts
