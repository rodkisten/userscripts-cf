name: 🧩 US · TypeScript diagnostics
run-name: "🔍 TypeScript diagnostics · ${{ github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Collect TypeScript diagnostics
        uses: rodkisten/github/execute@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          package-manager: npm
          install: "true"
          install-args: --legacy-peer-deps
          script: node scripts/typescript-diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-errors
          path: artifacts/typescript-diagnostics/
          retention-days: 3
          if-no-files-found: warn
