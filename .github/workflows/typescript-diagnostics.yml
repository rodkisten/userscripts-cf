name: TypeScript diagnostics
run-name: "🔍 TypeScript diagnostics · ${{ github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Collect TypeScript diagnostics
        run: node scripts/typescript-diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-errors
          path: artifacts/typescript-diagnostics/
          retention-days: 3
          if-no-files-found: warn
