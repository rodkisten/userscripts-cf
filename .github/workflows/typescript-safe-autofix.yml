name: "🛠️ TypeScript · safe autofix"
run-name: "🛠️ TS autofix · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate changed userscripts", "🧩 Button · Typecheck & Build"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/typescript-safe-autofix.yml

permissions:
  contents: read

concurrency:
  group: typescript-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Confirm TypeScript diagnostics (not an unrelated CI failure)
        id: diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/rod-typescript-diagnostics.log 2>&1
          code=$?
          set -e
          if [[ $code -ne 0 ]] && grep -Eq 'error TS[0-9]+' /tmp/rod-typescript-diagnostics.log; then
            echo 'has_typescript_errors=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_typescript_errors=false' >> "$GITHUB_OUTPUT"
          fi
          tail -n 40 /tmp/rod-typescript-diagnostics.log >> "$GITHUB_STEP_SUMMARY"
      - name: Apply conservative TypeScript code fixes
        if: steps.diagnostics.outputs.has_typescript_errors == 'true'
        id: repair
        continue-on-error: true
        run: node build/typescript-safe-autofix.mjs
      - name: Upload complete TypeScript diagnostics
        if: always() && steps.diagnostics.outputs.has_typescript_errors == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-autofix-diagnostics
          path: artifacts/typescript-autofix-diagnostics.json
          if-no-files-found: warn
      - name: Format changed files
        if: steps.diagnostics.outputs.has_typescript_errors == 'true'
        run: |
          mapfile -d '' files < <(git diff --name-only -z -- '*.ts' '*.tsx')
          if (( ${#files[@]} )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Detect changes
        id: changes
        if: steps.diagnostics.outputs.has_typescript_errors == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- src/)" ]]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
      - name: Verify AST output before publication
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z -- '*.ts' '*.tsx')
          if (( ${#files[@]} == 0 )); then
            echo '::error::No TypeScript changes to verify'
            exit 1
          fi
          npx prettier --check "${files[@]}"
          node --input-type=module <<'NODE'
          import ts from 'typescript';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM', '--', '*.ts', '*.tsx'], {encoding:'utf8'}).trim().split('\\n').filter(Boolean);
          for (const file of files) {
            const source = ts.createSourceFile(file, fs.readFileSync(file,'utf8'), ts.ScriptTarget.Latest, true, file.endsWith('.tsx') ? ts.ScriptKind.TSX : ts.ScriptKind.TS);
            if (source.parseDiagnostics.length) {
              console.error(ts.formatDiagnosticsWithColorAndContext(source.parseDiagnostics, {getCurrentDirectory:process.cwd,getCanonicalFileName:x=>x,getNewLine:()=> '\\n'}));
              process.exitCode = 1;
            }
          }
          NODE
      - name: Preserve verified patch even if bot authentication fails
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: git diff --binary -- src/ > artifacts/typescript-autofix.patch
      - name: Upload verified autofix patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-autofix-patch
          path: artifacts/typescript-autofix.patch
          if-no-files-found: error
      - name: Authenticate Rod GitHub App
        id: app-token
        if: steps.diagnostics.outputs.has_typescript_errors == 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID || secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create reviewable autofix PR as Rod bot
        if: steps.diagnostics.outputs.has_typescript_errors == 'true' && steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/typescript-safe-autofix
          delete-branch: true
          commit-message: "fix(types): apply safe TypeScript code fixes"
          title: "fix(types): safe automated TypeScript cleanup"
          body: |
            Conservative TypeScript language-service fixes only. Review the diff before merging.
            No broad type assertions, ignored errors or dependency upgrades.
            Conversation: https://chatgpt.com/share/6afb9d5d-b7a0-83e9-9fb5-3914d7e1d920?ogimg=plain
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          add-paths: |
            src/**/*.ts
            src/**/*.tsx

      - name: Report unrepaired TypeScript errors
        if: steps.repair.outcome == 'failure' && steps.changes.outputs.changed != 'true'
        run: |
          echo '::error::TypeScript errors remain without a supported AST fix. See the diagnostics artifact.'
          exit 1
