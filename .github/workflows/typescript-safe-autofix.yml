name: "🛠️ TypeScript · safe autofix"
run-name: "🛠️ TS autofix · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate changed userscripts", "🧩 Button · Typecheck & Build"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/typescript-safe-autofix.yml

permissions:
  contents: read

concurrency:
  group: typescript-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Confirm TypeScript diagnostics (not an unrelated CI failure)
        id: diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/rod-typescript-diagnostics.log 2>&1
          code=$?
          set -e
          if [[ $code -ne 0 ]] && grep -Eq 'error TS[0-9]+' /tmp/rod-typescript-diagnostics.log; then
            echo 'has_typescript_errors=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_typescript_errors=false' >> "$GITHUB_OUTPUT"
          fi
          tail -n 40 /tmp/rod-typescript-diagnostics.log >> "$GITHUB_STEP_SUMMARY"
      - name: Apply conservative TypeScript code fixes
        if: steps.diagnostics.outputs.has_typescript_errors == 'true'
        run: node build/typescript-safe-autofix.mjs
      - name: Format changed files
        if: steps.diagnostics.outputs.has_typescript_errors == 'true'
        run: |
          mapfile -d '' files < <(git diff --name-only -z -- '*.ts' '*.tsx')
          if (( ${#files[@]} )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Create reviewable autofix PR as Rod bot
        if: steps.diagnostics.outputs.has_typescript_errors == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/typescript-safe-autofix
          delete-branch: true
          commit-message: "fix(types): apply safe TypeScript code fixes"
          title: "fix(types): safe automated TypeScript cleanup"
          body: |
            Conservative TypeScript language-service fixes only. Review the diff before merging.
            No broad type assertions, ignored errors or dependency upgrades.
            Conversation: https://chatgpt.com/share/6afb9d5d-b7a0-83e9-9fb5-3914d7e1d920?ogimg=plain
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          add-paths: |
            src/**/*.ts
            src/**/*.tsx
