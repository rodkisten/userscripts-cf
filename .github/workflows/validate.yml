name: "🧩 US · Validate & Preview"
run-name: "🧪 US · Validate & Preview · ${{ github.event.pull_request.number || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope"
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: userscripts-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.action != 'closed'
    name: "🔍 Validate affected files"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🤖 Generate GitHub App token
        id: app_token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rodkisten/github/app-token@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: 📦 Setup and install dependencies
        id: install
        continue-on-error: true
        uses: rodkisten/github/execute@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          node-version: "24"
          package-manager: npm
          install: "true"
          install-args: --legacy-peer-deps
          script: ":"
      - name: 🛡️ Check build and release JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find build scripts -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) -print0)
          printf 'Checking %s build and automation scripts\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do
            node --check "$script"
          done

      - name: Repository-wide JS/TS syntax verification
        run: node build/check-source-syntax.mjs

      - name: "[EXP] Mapear grafo de dependências e testes"
        id: graph
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/analyze-impact-graph.mjs --out=.impact-graph.json

      - name: 🧭 Detect changes and plan validation
        id: plan
        if: steps.install.outcome == 'success'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ inputs.scope || (github.event_name == 'push' && 'all') || 'changed' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-changed.mjs plan

      - name: 🧩 Smoke-check build orchestrator imports and initialization
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        run: node build/build.mjs --list-targets

      - name: 🛠️ Dispatch lockfile repair when installation fails
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run repair-lockfile.yml --ref "$BRANCH" -f selected_branch="$BRANCH"
          echo "Lockfile repair requested for $BRANCH. Its commit will trigger a new validation." >> "$GITHUB_STEP_SUMMARY"

      - name: ❌ Fail current validation on installation error
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: 🔎 Detect modified JS/TS/CSS files and linters
        id: detect_lint
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-pr-lint.mjs detect-lint

      - name: 🪄 Lint & Format Gate (Auto-fix, Commit & Report)
        id: lint_gate
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          HAS_PRETTIER: ${{ steps.detect_lint.outputs.has_prettier }}
          HAS_ESLINT: ${{ steps.detect_lint.outputs.has_eslint }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-pr-lint.mjs fix-and-gate

      - name: Check design system documentation for PR changes
        if: github.event_name == 'pull_request' && steps.install.outcome == 'success'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run check:design-system

      - name: ♻️ Restore exact-source validation result
        id: validation_cache
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch' && !contains(github.event.pull_request.title, '(test:') && !contains(github.event.pull_request.title, '(build:')
        uses: actions/cache/restore@v4
        with:
          path: .validation-cache/passed
          key: userscripts-validation-v4-${{ runner.os }}-node24-${{ hashFiles('src/**', 'tests/**', 'build/**', 'scripts/**', '.github/workflows/validate.yml', 'userscripts.config.js', 'labs/**', 'playground/**', 'public/**', 'migration/**', 'userscripts.config.js', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.js', 'tsconfig.react.json') }}

      - name: Typecheck
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success'
        run: npm run typecheck
        timeout-minutes: 5

      - name: Lint
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full == 'true' && github.event_name != 'pull_request'
        run: npm run lint
        timeout-minutes: 5

      - name: Build all userscripts
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full == 'true' && github.event_name != 'pull_request'
        run: npm run build
        timeout-minutes: 35

      - name: Verify distribution metadata and hashes
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full == 'true' && github.event_name != 'pull_request'
        run: node build/verify-distribution.mjs
        timeout-minutes: 2

      - name: Runtime and utility tests
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full == 'true' && github.event_name != 'pull_request'
        run: npm run test:unit
        timeout-minutes: 5

      - name: Generate hosting
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.plan.outputs.full == 'true' && github.event_name != 'pull_request'
        run: node build/hosting.mjs
        timeout-minutes: 5

      - name: ✅ Validate affected code
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true' && (steps.plan.outputs.full != 'true' || github.event_name == 'pull_request')
        env:
          FULL: ${{ steps.plan.outputs.full }}
          SCRIPT_TESTS_SEPARATE: false
          SCOPED_BUILDS_MATRIX: "true"
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME_TEST_SKIP_DIST: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-changed.mjs run
        timeout-minutes: 15

      - name: 🎨 Build visual playground (independent of typecheck)
        if: always() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.lint_gate.outcome != 'failure'
        run: node build/design-system.mjs

      - name: 📝 Record successful exact-source validation
        if: steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && steps.validation_cache.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .validation-cache
          printf '%s\n' "Validation passed for exact source fingerprint" > .validation-cache/passed

      - name: 💾 Save successful exact-source validation
        if: steps.validation_cache.outputs.cache-hit != 'true' && steps.plan.outputs.run == 'true' && steps.plan.outputs.full != 'true' && github.event_name != 'workflow_dispatch' && success()
        uses: actions/cache/save@v4
        with:
          path: .validation-cache/passed
          key: ${{ steps.validation_cache.outputs.cache-primary-key }}

      - name: ⚡ Report reused validation
        if: steps.validation_cache.outputs.cache-hit == 'true'
        run: echo "Reused successful validation for identical source, tests and configuration fingerprint." >> "$GITHUB_STEP_SUMMARY"

      - name: Build, package & publish PR preview to Cloudflare R2
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: publish
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_UPLOAD_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          node scripts/cloudflare-pr-preview.mjs --mode=publish

      - name: Authenticate preview comment publisher
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: app-token
        uses: rodkisten/github/app-token@dc39d2a9755e5a1dd3b10b81532c1b724e2d6a11
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - name: Verify preview and source revision
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 6); do
            manifest="$(curl -fsSL --max-time 15 "${PREVIEW_URL}manifest.json" || true)"
            source_sha="$(printf '%s' "$manifest" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).sourceSha||"")}catch{}})')"
            if [ "$source_sha" = "$PR_HEAD_SHA" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Published preview manifest does not match PR head $PR_HEAD_SHA"
          exit 1
      - name: Collect preview metadata
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: diff-info
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/github-actions.mjs collect
      - name: Publish preview comment
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
          SHORT_SHA: ${{ steps.diff-info.outputs.short_sha }}
          COMMIT_URL: ${{ steps.diff-info.outputs.commit_url }}
          DIFF_ENTRY: ${{ steps.diff-info.outputs.diff_entry }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: node scripts/github-actions.mjs publish

  cleanup:
    name: "🧹 Cleanup PR #${{ github.event.pull_request.number }} preview"
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Remove closed PR preview from Cloudflare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_UPLOAD_TOKEN: ${{ secrets.PREVIEW_UPLOAD_TOKEN }}
        run: node scripts/cloudflare-pr-preview.mjs --mode=cleanup
