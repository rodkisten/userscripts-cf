name: 👷‍♀️Validate Workflow Script Paths

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.ts'
      - '**.tsx'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-workflows:
    name: Check Workflow Script References
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Scan Workflows for Invalid Script Paths
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/workflows-validate.mjs --json > workflow-audit-report.json

      - name: Publish Summary, Annotations, Labels & Issue/PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: workflow-audit-report.json
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --experimental-strip-types scripts/workflows-audit-publish.ts
