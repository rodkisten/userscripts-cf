<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Form Controls · SolidJS Playground</title>
    <link rel="stylesheet" href="/playground/form-controls.css" />
    <style>
      :root {
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #f4f4f5;
        background: #09090b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: clamp(18px, 4vw, 40px);
      }
      a {
        color: #c4b5fd;
      }
      h1 {
        font-size: clamp(30px, 5vw, 48px);
        letter-spacing: -0.05em;
        margin: 10px 0;
      }
      p,
      small,
      .eyebrow {
        color: #a1a1aa;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 16px;
      }
      .card {
        background: #18181b;
        border: 1px solid #3f3f46;
        border-radius: 18px;
        padding: 20px;
        min-width: 0;
      }
      .wide {
        grid-column: 1/-1;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        background: #09090b;
        border: 1px solid #52525b;
        border-radius: 10px;
        padding: 12px;
        color: inherit;
        font: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .actions button,
      .card > button {
        background: #27272a;
        border: 1px solid #52525b;
        border-radius: 10px;
        padding: 8px 12px;
      }
      .toggle {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #c4b5fd;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main><p>Carregando componentes SolidJS…</p></main>
    </div>
    <script type="module" src="/playground/form-controls.js"></script>
  </body>
</html>
