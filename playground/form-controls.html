<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Form Controls · SolidJS Playground</title>
    <link rel="stylesheet" href="/playground/form-controls.css" />
    <style>
      :root {
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #f4f4f5;
        background: #09090b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: clamp(18px, 4vw, 40px);
      }
      a {
        color: #c4b5fd;
      }
      h1 {
        font-size: clamp(30px, 5vw, 48px);
        letter-spacing: -0.05em;
        margin: 10px 0;
      }
      p,
      small,
      .eyebrow {
        color: #a1a1aa;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 16px;
      }
      .card {
        background: #18181b;
        border: 1px solid #3f3f46;
        border-radius: 18px;
        padding: 20px;
        min-width: 0;
      }
      .wide {
        grid-column: 1/-1;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        background: #09090b;
        border: 1px solid #52525b;
        border-radius: 10px;
        padding: 12px;
        color: inherit;
        font: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .actions button,
      .card > button {
        background: #27272a;
        border: 1px solid #52525b;
        border-radius: 10px;
        padding: 8px 12px;
      }
      .toggle {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #c4b5fd;
        font-size: 12px;
      }

      html,
      body {
        width: 100%;
        overflow-x: clip;
        -webkit-text-size-adjust: 100%;
      }
      #app,
      main,
      .grid,
      .card,
      .card > *,
      .grid > * {
        min-width: 0;
        max-width: 100%;
      }
      main {
        width: 100%;
        padding: clamp(16px, 4vw, 28px);
      }
      .grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
      .card {
        padding: clamp(16px, 4vw, 24px);
        overflow-wrap: anywhere;
      }
      .card h2 {
        font-size: clamp(21px, 5.5vw, 28px);
        line-height: 1.2;
        margin: 0 0 12px;
      }
      .card p {
        margin: 0 0 20px;
      }
      .card label:not(.toggle) {
        margin-top: 12px;
      }
      .card input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
      .card select,
      .card textarea {
        font-size: 16px;
        max-width: 100%;
      }
      .card select {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 10px 36px 10px 12px;
        border: 1px solid #52525b;
        border-radius: 10px;
        background-color: #27272a;
        color: #fafafa;
      }
      .card button {
        min-height: 40px;
      }
      .card pre {
        overflow-x: auto;
        max-width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .toggle {
        min-height: 40px;
        line-height: 1.35;
      }
      .toggle input {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .actions {
        align-items: center;
      }
      .actions button {
        padding: 10px 12px;
      }
      @media (min-width: 760px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .wide {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 30px;
          line-height: 1.15;
        }
        .card {
          border-radius: 16px;
        }
        .card button {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main><p>Carregando componentes SolidJS…</p></main>
    </div>
    <script>
      const host = document.getElementById("app");
      const asset = "/playground/form-controls.js";
      const startedAt = Date.now();
      const status = { asset, userAgent: navigator.userAgent, page: location.href };
      let mounted = false;
      window.__rodPlaygroundReady = () => {
        mounted = true;
        clearTimeout(timeout);
      };
      let failed = false;
      const timeout = setTimeout(() => {
        if (!mounted) showError(new Error("Timeout de inicialização: o módulo não montou em 12 segundos."));
      }, 12000);
      const showError = (error) => {
        const message = error instanceof Error ? error.message : String(error);
        const stack = error?.stack ? String(error.stack) : "Stack indisponível";
        if (!host || mounted || failed) return;
        failed = true;
        clearTimeout(timeout);
        host.replaceChildren();
        const main = document.createElement("main");
        main.dataset.playgroundError = "true";
        const heading = document.createElement("h1");
        heading.textContent = "Não foi possível iniciar o playground";
        const description = document.createElement("p");
        description.textContent =
          "O JavaScript não carregou ou falhou ao inicializar. Recarregue a página ou copie o diagnóstico abaixo.";
        const details = document.createElement("pre");
        details.style.whiteSpace = "pre-wrap";
        details.style.overflowWrap = "anywhere";
        details.textContent = JSON.stringify(
          { message, stack, elapsedMs: Date.now() - startedAt, ...status },
          null,
          2,
        );
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Tentar novamente";
        retry.addEventListener("click", () => location.reload());
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copiar diagnóstico";
        copy.addEventListener("click", () => navigator.clipboard?.writeText(details.textContent));
        main.append(heading, description, details, retry, document.createTextNode(" "), copy);
        host.append(main);
      };
      window.addEventListener("error", (event) => {
        if (!mounted)
          showError(
            event.error ?? new Error(`${event.message} at ${event.filename}:${event.lineno}:${event.colno}`),
          );
      });
      window.addEventListener("unhandledrejection", (event) => {
        if (!mounted) showError(event.reason);
      });
      // A classic bootstrap runs even when module loading fails before evaluation.
      import(asset)
        .then(() => {
          if (failed) return;
          // Rendering may finish in a microtask after the ESM import resolves.
          // The application explicitly signals readiness after its root exists.
          if (!mounted && !failed) {
            setTimeout(() => {
              if (!mounted && !failed && !host?.querySelector("main")) {
                showError(new Error("Bundle carregado, mas SolidJS não criou a raiz da aplicação."));
              }
            }, 1500);
          }
        })
        .catch(showError);
    </script>
  </body>
</html>
