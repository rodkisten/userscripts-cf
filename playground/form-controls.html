<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Form Controls · SolidJS Playground</title>
    <link rel="stylesheet" href="/playground/form-controls.css" />
    <style>
      :root {
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #f4f4f5;
        background: #09090b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: clamp(18px, 4vw, 40px);
      }
      a {
        color: #c4b5fd;
      }
      h1 {
        font-size: clamp(30px, 5vw, 48px);
        letter-spacing: -0.05em;
        margin: 10px 0;
      }
      p,
      small,
      .eyebrow {
        color: #a1a1aa;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 16px;
      }
      .card {
        background: #18181b;
        border: 1px solid #3f3f46;
        border-radius: 18px;
        padding: 20px;
        min-width: 0;
      }
      .wide {
        grid-column: 1/-1;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        background: #09090b;
        border: 1px solid #52525b;
        border-radius: 10px;
        padding: 12px;
        color: inherit;
        font: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .actions button,
      .card > button {
        background: #27272a;
        border: 1px solid #52525b;
        border-radius: 10px;
        padding: 8px 12px;
      }
      .toggle {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #c4b5fd;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main><p>Carregando componentes SolidJS…</p></main>
    </div>
    <script>
      (() => {
        const entry = "/playground/form-controls.js";
        const target = document.getElementById("app");
        let finished = false;
        const report = (message) => {
          if (finished || !target || !target.textContent?.includes("Carregando componentes SolidJS")) return;
          finished = true;
          const main = document.createElement("main");
          const heading = document.createElement("h1");
          heading.textContent = "Não foi possível abrir o playground";
          const detail = document.createElement("p");
          detail.textContent = message;
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "Tentar novamente";
          retry.onclick = () => location.reload();
          const link = document.createElement("a");
          link.href = entry;
          link.textContent = "Verificar arquivo JavaScript";
          link.style.marginLeft = "16px";
          main.append(heading, detail, retry, link);
          target.replaceChildren(main);
        };
        window.addEventListener("error", (event) => {
          report(event.message || "Falha ao carregar o JavaScript do playground.");
        });
        window.addEventListener("unhandledrejection", (event) => {
          report(String(event.reason?.message || event.reason || "Falha na inicialização."));
        });
        const timer = setTimeout(() => {
          if (target?.textContent?.includes("Carregando componentes SolidJS")) {
            fetch(entry, { cache: "no-store" })
              .then((response) =>
                report(
                  response.ok
                    ? "O arquivo JavaScript respondeu, mas o SolidJS não montou a interface. Verifique os erros do navegador."
                    : "O bundle do playground não está disponível (HTTP " +
                        response.status +
                        "). Confira o deploy do Worker.",
                ),
              )
              .catch(() =>
                report("Não foi possível carregar o bundle JavaScript. Confira a conexão e o deploy."),
              );
          }
        }, 8000);
        new MutationObserver(() => {
          if (!target?.textContent?.includes("Carregando componentes SolidJS")) {
            finished = true;
            clearTimeout(timer);
          }
        }).observe(target, { childList: true, subtree: true });
      })();
    </script>
    <script type="module">
      const host = document.getElementById("app");
      const asset = "/playground/form-controls.js";
      const showError = (error) => {
        const message = error instanceof Error ? error.message : String(error);
        if (!host) return;
        host.replaceChildren();
        const main = document.createElement("main");
        const heading = document.createElement("h1");
        heading.textContent = "Não foi possível iniciar o playground";
        const description = document.createElement("p");
        description.textContent =
          "O JavaScript não carregou ou falhou ao inicializar. Recarregue a página ou copie o diagnóstico abaixo.";
        const details = document.createElement("pre");
        details.style.whiteSpace = "pre-wrap";
        details.style.overflowWrap = "anywhere";
        details.textContent = message;
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Tentar novamente";
        retry.addEventListener("click", () => location.reload());
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copiar diagnóstico";
        copy.addEventListener("click", () => navigator.clipboard?.writeText(message));
        main.append(heading, description, details, retry, document.createTextNode(" "), copy);
        host.append(main);
      };
      window.addEventListener("error", (event) => showError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => showError(event.reason));
      try {
        await import(asset);
        if (host?.textContent?.includes("Carregando componentes SolidJS")) {
          showError(new Error("O módulo foi importado, mas a aplicação não montou."));
        }
      } catch (error) {
        showError(error);
      }
    </script>
  </body>
</html>
