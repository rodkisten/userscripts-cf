<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Instagram Bookmark · Preview</title>
<style>:root{font:16px/1.5 system-ui,-apple-system,sans-serif;color:#fafafa;background:#09090b;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:clamp(16px,4vw,32px)}h1{font-size:clamp(30px,7vw,44px);letter-spacing:-.04em;margin:8px 0}h2{font-size:19px;margin:0 0 16px}p,footer{color:#a1a1aa}main>small{font-size:11px;letter-spacing:.13em;font-weight:700;color:#c4b5fd}.card{border:1px solid #27272a;border-radius:20px;background:#18181b;padding:18px;margin:20px 0}.reel{aspect-ratio:9/12;max-height:460px;border-radius:16px;background:linear-gradient(145deg,#342145,#14121d 55%,#211a35);display:flex;align-items:flex-end;justify-content:space-between;padding:20px}.reelInfo{display:flex;flex-direction:column;gap:5px}.avatar{width:40px;height:40px;border-radius:50%;background:#7c3aed;display:grid;place-items:center;font-weight:700}.reelActions{display:flex;flex-direction:column;gap:12px;align-items:center}.reelActions>span{font-size:29px;width:44px;height:44px;display:grid;place-items:center}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{background:#27272a;color:#fafafa;border:1px solid #3f3f46;border-radius:10px;padding:10px 13px;font:inherit;min-height:44px;cursor:pointer}.choices button.selected{border-color:#a78bfa;background:#3b2b58}.examples{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:22px}.example{display:flex;align-items:center;flex-direction:column;gap:6px;font-size:12px;text-align:center;color:#a1a1aa}footer{font-size:13px;padding-bottom:24px}</style></head><body><div id="app"><main>Carregando preview…</main></div><script type="module" src="/playground/instagram-bookmark.js"></script></body></html>
